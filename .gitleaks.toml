[extend]
# Use the default gitleaks ruleset
useDefault = true

[allowlist]
regexes = [
  # The bundled ADE Linear OAuth app CLIENT ID (public by design — it appears
  # in every user's authorize URL; sign-in uses PKCE and no client secret
  # ships in the repo). Gitleaks' linear-client-secret rule cannot tell a
  # 32-hex client id from a client secret.
  '''e552c738cd63ea5967f08bbc9c09b54c''',
  # Clerk *publishable* keys (pk_test_… / pk_live_…) are public by design —
  # Clerk documents them as safe to embed in client apps and commit to source
  # control (they identify the frontend instance; the real secret is the sk_…
  # secret key, which never ships in this repo). The iOS app carries its
  # publishable key in the Xcode build settings / Info.plist, which trips
  # gitleaks' high-entropy generic-api-key rule. Only pk_ (publishable) keys
  # are allowlisted here; sk_ (secret) keys remain caught.
  '''pk_(test|live)_[A-Za-z0-9_-]+''',
  # Deliberately fake test fixtures (present in PR history as well as HEAD):
  # a synthetic 32-hex sync machine key in connect.test.ts and the synthetic
  # PostHog project-token fixtures in the web api tests. None is a credential;
  # phc_ project tokens are public-by-design client tokens in any case, and
  # the phx_ fixture exists to prove personal keys are REJECTED.
  '''a3f2c1d4e5b60718293a4b5c6d7e8f90''',
  '''phc_abcdefgh12345678''',
  '''phx_personalkey123''',
]
paths = [
  '''\.env\.example$''',
  '''node_modules/''',
  '''dist/''',
  '''release/''',
  '''\.git/''',
  '''(^|/)__fixtures__/''',
  '''(^|/)fixtures/''',
  '''(^|/)__mocks__/''',
]
