[extend]
# Use the default gitleaks ruleset
useDefault = true

[allowlist]
regexes = [
  # The bundled ADE Linear OAuth app CLIENT ID (public by design — it appears
  # in every user's authorize URL; sign-in uses PKCE and no client secret
  # ships in the repo). Gitleaks' linear-client-secret rule cannot tell a
  # 32-hex client id from a client secret.
  '''e552c738cd63ea5967f08bbc9c09b54c''',
  # Clerk *publishable* keys (pk_test_… / pk_live_…) are public by design —
  # Clerk documents them as safe to embed in client apps and commit to source
  # control (they identify the frontend instance; the real secret is the sk_…
  # secret key, which never ships in this repo). The iOS app carries its
  # publishable key in the Xcode build settings / Info.plist, which trips
  # gitleaks' high-entropy generic-api-key rule. Only pk_ (publishable) keys
  # are allowlisted here; sk_ (secret) keys remain caught.
  '''pk_(test|live)_[A-Za-z0-9_-]+''',
  # Deliberately fake test fixtures (present in PR history as well as HEAD):
  # a synthetic 32-hex sync machine key in connect.test.ts and the synthetic
  # PostHog project-token fixtures in the web api tests. None is a credential;
  # phc_ project tokens are public-by-design client tokens in any case, and
  # the phx_ fixture exists to prove personal keys are REJECTED.
  '''a3f2c1d4e5b60718293a4b5c6d7e8f90''',
  # The fake machine key in the iOS Work preview fixtures (WorkPreviews.swift).
  '''0123456789abcdef0123456789abcdef''',
  '''phc_abcdefgh12345678''',
  '''phx_personalkey123''',
  # The fake GitHub token in productAnalyticsService.test.ts that proves a
  # typed survey answer is scrubbed of secrets before it reaches PostHog.
  '''ghp_abcdefghijklmnopqrstuvwxyz0123456789''',
  # The machine key store's file NAME, "api-keys.v1.bin". A path segment, not a
  # key: it appears as a literal in `apiKeyStore.ts` and its test, and gitleaks'
  # generic-api-key rule fires on it because the surrounding identifier says
  # KEY. A regex rather than commit-scoped fingerprints, because a fingerprint
  # is `<commit>:<file>:<rule>:<line>` and every rebase of the lane that
  # introduced these literals reassigns the commit — so the exception silently
  # stopped applying exactly when the branch was refreshed.
  '''api-keys\.v1\.bin''',
  # Namespaced credential provenance key (`ai.api_key.provenance.v1`), not a
  # secret. Same generic-api-key false positive as the file name above — the
  # const ends in KEY and the namespaced value has mild entropy. Regex rather
  # than a commit fingerprint so a rebase does not revive the finding.
  '''ai\.api_key\.provenance\.v1''',
  # Star-on-GitHub pill's localStorage key name (`ade.starPill.v1`), not a
  # secret. Same generic-api-key false positive: `STAR_PILL_STORAGE_KEY` ends in
  # KEY and the namespaced value has mild entropy. Regex for the same reason.
  '''ade\.starPill\.v1''',
  # LocalStorage key names for suggestions and ADE Tips, not secrets. The
  # generic-api-key rule flags their KEY-suffixed const names and mild entropy;
  # use a regex so rebases do not revive the finding.
  '''ade\.(suggestions(\.prompts)?|tips\.suggestions)\.v1''',
  # Synthetic token tail in homeClipboardHistory.test.ts, used to build fake
  # ghp_/sk-proj- strings that prove clipboard history redacts them.
  '''a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8''',
  # Clerk OAuth application CLIENT ID in apps/webhook-relay/wrangler.jsonc
  # (CLERK_EXTRA_OAUTH_CLIENT_IDS). Public by design: it appears in every
  # authorize URL; the client secret is never in the repo.
  '''Az7TbviBocyXjZk1''',
]
paths = [
  '''\.env\.example$''',
  '''node_modules/''',
  '''dist/''',
  '''release/''',
  '''\.git/''',
  '''(^|/)__fixtures__/''',
  '''(^|/)fixtures/''',
  '''(^|/)__mocks__/''',
]
