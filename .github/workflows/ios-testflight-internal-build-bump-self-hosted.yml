name: iOS internal TestFlight build bump (self-hosted asc)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: >-
          Git ref to checkout before archiving. Marketing version is always read from
          apps/ios/ADE.xcodeproj; this workflow never edits CFBundleShortVersionString.
        required: false
        default: main
        type: string
      submit_for_app_review:
        description: >-
          When true, validate the prepared App Store version and submit this newly-built
          iOS build to Apple for review after internal TestFlight distribution.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-tf-internal-bump-${{ github.repository }}
  cancel-in-progress: false

# Auth/env should match `.claude/commands/release.md` Phase 7: identical `asc`/Xcode toolchain as your Studio shell.
#
# IMPORTANT: keep APPLE_*/ASC authentication values in the runner environment — an empty GitHub Secret would
# override inherited auth and defeat “same ~/.asc / same ENV as `/release`”. The public PostHog runtime values are
# the deliberate exception below: they come from repository secrets and are passed to Xcode through a temporary,
# mode-0600 xcconfig that the release script deletes after the archive command finishes.
#
# Runs every `run` step with `bash --login -eo pipefail` so interactive-path setup (Apple Silicon Homebrew bins,
# Xcode paths, exporter env hooks) behaves like Terminal when you configured `asc doctor`.

jobs:
  internal-build-bump:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        shell: bash --login -eo pipefail {0}
    env:
      ASC_PUBLISH_WAIT_TIMEOUT: 60m
      IOS_SUBMIT_FOR_APP_REVIEW: ${{ inputs.submit_for_app_review }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Bump build and ship to internal testers
        env:
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
        run: bash ./.github/scripts/ios-testflight-internal-build-bump-asc.sh
