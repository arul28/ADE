name: Build the ADE Cloud template

# Builds the template ADE Cloud computers start from, from a release's tag,
# then tests that build on a real computer (infra/ade-cloud/promote-template.mjs)
# and, only when the test passes, moves the image setting of the tag's update
# channel: a prerelease tag moves Beta, a stable tag moves Stable. Cloud
# computers on that channel then update themselves when idle or asleep.
#
# The release's files must be public first, because the image installs that
# release. A stable release turns public when the release skill undrafts it,
# which is the `release` trigger here (betas turn public with GITHUB_TOKEN,
# which starts no workflow, so beta.yml calls this itself).
#
# It never blocks a release: the job is allowed to fail, and nothing waits on it.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build from, for example v1.2.130-beta.1.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build from, for example v1.2.129.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-template:
    # beta-feed and any prerelease published by hand are not releases of the
    # template; betas come through workflow_call instead.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # Must never fail the run that called it.
    continue-on-error: true
    timeout-minutes: 45
    # One build at a time. A queued build that a newer one replaces is harmless:
    # only a tested build ever becomes the one computers start from.
    concurrency:
      group: ade-cloud-template
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the template
        id: build
        env:
          AGENT37_API_KEY: ${{ secrets.AGENT37_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AGENT37_API_KEY" ]; then
            echo "::warning::AGENT37_API_KEY is not set; skipping the template build for $TAG."
            exit 0
          fi
          build="$(sh infra/ade-cloud/build-template.sh ade "$TAG" | tail -n 1)"
          echo "Built $build from $TAG"
          echo "build=${build#*@}" >> "$GITHUB_OUTPUT"
          echo "ADE Cloud template: \`$build\` from \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

  # Tests the new build the way a person uses it (a real repository opened as
  # a project, lanes, a terminal, sleep and wake) and moves the channel's image
  # only on a pass. A failed test moves nothing and computers stay where they are.
  promote-template:
    needs: build-template
    if: ${{ needs.build-template.outputs.build != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # The test itself gives up after 20 minutes and deletes its computer.
    timeout-minutes: 30
    concurrency:
      group: ade-cloud-template-promote
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      BUILD: ${{ needs.build-template.outputs.build }}
    steps:
      # The workflow's own commit, not the tag: an older tag's script has no --channel.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The pinned wrangler the script runs (npx finds it here, so nothing is downloaded).
      - name: Install the account server's tools
        working-directory: apps/account-directory
        run: npm ci --no-audit --no-fund

      - name: Test the build and move the channel
        env:
          AGENT37_API_KEY: ${{ secrets.AGENT37_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$AGENT37_API_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::A secret for the template test is not set; ade@$BUILD stays untested and no channel moves."
            exit 0
          fi
          # Any prerelease tag (beta, alpha, rc) is Beta; stable never moves to a prerelease.
          case "$TAG" in
            *-*) channel=beta ;;
            *) channel=stable ;;
          esac
          node infra/ade-cloud/promote-template.mjs "$BUILD" --move --channel "$channel" --expect-version "$TAG" --env production
          echo "ADE Cloud template: \`ade@$BUILD\` passed and is now the $channel image." >> "$GITHUB_STEP_SUMMARY"
