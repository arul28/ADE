name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Stacked PRs target their parent branch, not main, so the filter above
  # never fires for them and they accumulate no ci-pass check run. That
  # matters because release-core.yml's verify job requires ci-pass on the
  # exact SHA it builds, which made a signed proof build of a stacked
  # branch impossible. Dispatching by ref produces the same check runs on
  # the same SHA, so the release gate stays honest rather than relaxed.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the run already in flight
# obsolete, so cancel it and free the macOS slot for the run that can still
# change the answer. Pushes to main are never cancelled: each merge keeps its
# own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Stage 1: Install & cache ──────────────────────────────────────────
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # One cache per dependency group, so each job restores only the
      # node_modules it uses, and a PR that changes one lockfile saves only
      # that group instead of a fresh copy of everything. desktop and ade-cli
      # import each other's source, so they share one group. lookup-only
      # checks for the entry without downloading it; a miss installs below
      # and the post step saves the new entry.
      - name: Check core node_modules cache
        id: cache_core
        uses: actions/cache@v4
        with:
          lookup-only: true
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - name: Check web node_modules cache
        id: cache_web
        uses: actions/cache@v4
        with:
          lookup-only: true
          path: |
            apps/web/node_modules
          key: nm-web-v1-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Check webhook-relay node_modules cache
        id: cache_webhook_relay
        uses: actions/cache@v4
        with:
          lookup-only: true
          path: |
            apps/webhook-relay/node_modules
          key: nm-webhook-relay-v1-${{ runner.os }}-${{ hashFiles('apps/webhook-relay/package-lock.json') }}
      - name: Check push-relay node_modules cache
        id: cache_push_relay
        uses: actions/cache@v4
        with:
          lookup-only: true
          path: |
            apps/push-relay/node_modules
          key: nm-push-relay-v1-${{ runner.os }}-${{ hashFiles('apps/push-relay/package-lock.json') }}
      - name: Check sdk node_modules cache
        id: cache_sdk
        uses: actions/cache@v4
        with:
          lookup-only: true
          path: |
            packages/sdk/node_modules
          key: nm-sdk-v1-${{ runner.os }}-${{ hashFiles('packages/sdk/package-lock.json') }}
      - name: Check chat-ui node_modules cache
        id: cache_chat_ui
        uses: actions/cache@v4
        with:
          lookup-only: true
          path: |
            packages/chat-ui/node_modules
          key: nm-chat-ui-v1-${{ runner.os }}-${{ hashFiles('packages/chat-ui/package-lock.json') }}

      - name: Install missing dependency groups (parallel)
        if: steps.cache_core.outputs.cache-hit != 'true' || steps.cache_web.outputs.cache-hit != 'true' || steps.cache_webhook_relay.outputs.cache-hit != 'true' || steps.cache_push_relay.outputs.cache-hit != 'true' || steps.cache_sdk.outputs.cache-hit != 'true' || steps.cache_chat_ui.outputs.cache-hit != 'true'
        env:
          MISS_CORE: ${{ steps.cache_core.outputs.cache-hit != 'true' }}
          MISS_WEB: ${{ steps.cache_web.outputs.cache-hit != 'true' }}
          MISS_WEBHOOK_RELAY: ${{ steps.cache_webhook_relay.outputs.cache-hit != 'true' }}
          MISS_PUSH_RELAY: ${{ steps.cache_push_relay.outputs.cache-hit != 'true' }}
          MISS_SDK: ${{ steps.cache_sdk.outputs.cache-hit != 'true' }}
          MISS_CHAT_UI: ${{ steps.cache_chat_ui.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          pids=()
          # Electron 42+ fetches its binary on first require instead of in npm ci; fetch it
          # here so the cached node_modules carries it, as it did on Electron 41. Without it,
          # every brain a test starts from source downloads Electron before it can listen.
          if [ "$MISS_CORE" = "true" ]; then (cd apps/desktop && npm ci && node scripts/ensure-electron.cjs) & pids+=($!); fi
          if [ "$MISS_CORE" = "true" ]; then (cd apps/ade-cli && npm ci) & pids+=($!); fi
          if [ "$MISS_WEB" = "true" ]; then (cd apps/web && npm ci) & pids+=($!); fi
          if [ "$MISS_WEBHOOK_RELAY" = "true" ]; then (cd apps/webhook-relay && npm ci) & pids+=($!); fi
          if [ "$MISS_PUSH_RELAY" = "true" ]; then (cd apps/push-relay && npm ci) & pids+=($!); fi
          if [ "$MISS_SDK" = "true" ]; then (cd packages/sdk && npm ci) & pids+=($!); fi
          if [ "$MISS_CHAT_UI" = "true" ]; then (cd packages/chat-ui && npm ci) & pids+=($!); fi
          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more npm ci installs failed"
            exit 1
          fi

  # ── Secret scanning (no deps needed) ───────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On pull_request the action scans only the PR range. On workflow_dispatch
      # it scans the entire history instead, which re-reports every already
      # accepted false positive: gitleaks fingerprints are commit-scoped, so a
      # finding waived in .gitleaksignore reappears under the SHA of every later
      # commit that touched the same line. Scanning main..HEAD gives a dispatched
      # run exactly the scope a PR run has, so the same code is judged the same
      # way however CI was started.
      # gitleaks-action exposes no way to narrow its commit range, so a
      # dispatched run invokes gitleaks directly with the same pinned version
      # the action uses. --log-opts limits the walk to this branch's own
      # commits, matching what a pull_request run would scan.
      - name: Scan this branch's own commits
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --redact -v --exit-code=2 --log-opts="origin/main..HEAD"
      - uses: gitleaks/gitleaks-action@v2
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 2: Parallel checks ──────────────────────────────────────────
  typecheck-desktop:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - run: cd apps/desktop && npm run typecheck
        env:
          # tsc on the desktop codebase sits near Node's default ~4GB heap;
          # the lint script already needs --max-old-space-size=8192.
          NODE_OPTIONS: --max-old-space-size=8192

  typecheck-ade-cli:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - run: cd apps/ade-cli && npm run typecheck
      # scripts/validate-docs.test.mjs covers the docs validator that the
      # validate-docs job runs. scripts/check-package-licenses.test.mjs covers
      # the package-license checker that the test-sdk job runs.
      # scripts/check-source-nul-bytes.test.mjs covers the NUL-byte gate.
      # scripts/release-pipeline.test.mjs covers the release tag's CI gate, the
      # cached-build attestation check, the Mach-O arch check and Apple retries.
      # scripts/build/asciiBundleSource.test.mjs covers the bundle source map on
      # Windows chunk paths (the map Sentry symbolicates brain and main with).
      - name: Test release runtime archive, packaging, and docs-validator guards
        run: node --test apps/ade-cli/scripts/build-runtime-npm-packages.test.mjs apps/ade-cli/scripts/install-runtime-rollback.test.mjs apps/ade-cli/scripts/native-archive-verification.test.mjs apps/ade-cli/scripts/native-deps-entry-filter.test.mjs apps/ade-cli/scripts/notarize-static-runtime.test.mjs apps/ade-cli/scripts/package-native-deps.crsqlite.test.mjs apps/ade-cli/scripts/probe-runtime-crsqlite.test.mjs apps/ade-cli/scripts/verify-runtime-package-contents.test.mjs apps/desktop/scripts/mac-runtime-archive-mode.test.mjs apps/desktop/scripts/packaged-ade-cli-resources.test.mjs apps/desktop/scripts/runtime-fetched-tool-packages.test.mjs apps/desktop/scripts/runtime-resource-targets.test.mjs apps/desktop/scripts/windows-release-contract.test.mjs scripts/build/asciiBundleSource.test.mjs scripts/channelVersion.test.mjs scripts/channelSignIdentity.test.mjs scripts/check-package-licenses.test.mjs scripts/check-source-nul-bytes.test.mjs scripts/ci/ios-runner.test.mjs scripts/dev-shared.test.mjs scripts/release-pipeline.test.mjs scripts/ship-poll.test.mjs scripts/validate-docs.test.mjs scripts/validate-platform-gates.test.mjs

  typecheck-web:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/node_modules
          key: nm-web-v1-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: cd apps/web && npm run typecheck
      - run: cd apps/web && npm run test:analytics
      - run: npm run test:posthog

  typecheck-webhook-relay:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/webhook-relay/node_modules
          key: nm-webhook-relay-v1-${{ runner.os }}-${{ hashFiles('apps/webhook-relay/package-lock.json') }}
      - run: cd apps/webhook-relay && npm run typecheck

  typecheck-push-relay:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/push-relay/node_modules
          key: nm-push-relay-v1-${{ runner.os }}-${{ hashFiles('apps/push-relay/package-lock.json') }}
      - run: cd apps/push-relay && npm run typecheck

  lint-desktop:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - run: cd apps/desktop && npm run test:lint-tooling
      - run: cd apps/desktop && npm run lint:ci
      # The iOS scene shell and the web client's scene headers are copies of
      # the scene document's one source; this fails when either has drifted.
      - run: node apps/desktop/scripts/generate-ios-scene-shell.mjs --check
      # The iOS settings-chip labels are a copy of the settings manifest.
      - run: node apps/desktop/scripts/generate-ios-settings-catalog.mjs --check

  test-desktop:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - run: cd apps/desktop && npx vitest run --shard=${{ matrix.shard }}/8

  test-ade-cli:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - run: cd apps/ade-cli && npm test

  # The publishable packages. Typecheck and unit suites run together per
  # package rather than as separate jobs: each is small, and a split would pay
  # the checkout+restore cost twice for a suite that finishes in seconds.
  # Deliberately NOT folded into the desktop shards — these have their own
  # dependency trees and must fail with their own name.
  test-sdk:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            packages/sdk/node_modules
          key: nm-sdk-v1-${{ runner.os }}-${{ hashFiles('packages/sdk/package-lock.json') }}
      - run: cd packages/sdk && npm run typecheck
      - run: node packages/sdk/scripts/check-wire-types.mjs
      # Every published package must carry its own LICENSE, because the root
      # LICENSE does not travel in an npm tarball. --require-pack checks the
      # real tarball listing, not just the "files" field, and fails the job if
      # npm cannot be run rather than logging that it skipped the check.
      - name: Check published package licenses
        run: node scripts/check-package-licenses.mjs --require-pack
      # Hermetic only. The live fixture (test/live.integration.test.ts) needs a
      # built runtime binary and skips itself unless ADE_SDK_LIVE_BINARY is set.
      - run: cd packages/sdk && npm test
      - run: cd packages/sdk && npm run build

  test-chat-ui:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            packages/sdk/node_modules
          key: nm-sdk-v1-${{ runner.os }}-${{ hashFiles('packages/sdk/package-lock.json') }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            packages/chat-ui/node_modules
          key: nm-chat-ui-v1-${{ runner.os }}-${{ hashFiles('packages/chat-ui/package-lock.json') }}
      # `@ade-dev/sdk` resolves through a `file:../sdk` symlink whose exports and
      # types point at `packages/sdk/dist`, which is gitignored. On a fresh
      # checkout that directory does not exist, so `tsc` cannot resolve the
      # module and both typecheck and build fail (the unit suite survives only
      # because every import of it is type-only). Build it first.
      - run: cd packages/sdk && npm run build
      - run: cd packages/chat-ui && npm run typecheck
      - run: cd packages/chat-ui && npm test
      - run: cd packages/chat-ui && npm run build

  test-webhook-relay:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/webhook-relay/node_modules
          key: nm-webhook-relay-v1-${{ runner.os }}-${{ hashFiles('apps/webhook-relay/package-lock.json') }}
      - run: cd apps/webhook-relay && npm test

  # Small and dependency-light, so it installs on its own instead of joining
  # the shared node_modules cache.
  test-password-key-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd apps/password-key-service && npm ci
      - run: cd apps/password-key-service && npm run typecheck
      - run: cd apps/password-key-service && npm test

  test-push-relay:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/push-relay/node_modules
          key: nm-push-relay-v1-${{ runner.os }}-${{ hashFiles('apps/push-relay/package-lock.json') }}
      - run: cd apps/push-relay && npm test

  # apps/tunnel-relay has its own lockfile and is not in the shared install
  # cache, so these jobs install it inline (self-contained, append-only).
  typecheck-tunnel-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd apps/tunnel-relay && npm ci
      - run: cd apps/tunnel-relay && npm run typecheck

  test-tunnel-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd apps/tunnel-relay && npm ci
      - name: Run fake and workerd relay tests
        run: cd apps/tunnel-relay && npm test

  # The account directory is an independently deployed Worker with its own
  # lockfile. Keep auth/device-flow verification isolated from the shared app
  # dependency cache, matching the tunnel relay's self-contained jobs.
  typecheck-account-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd apps/account-directory && npm ci
      - run: cd apps/account-directory && npm run typecheck
      - run: cd apps/account-directory && npm run build

  test-account-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd apps/account-directory && npm ci
      - run: cd apps/account-directory && npm test

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/node_modules
          key: nm-web-v1-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: cd apps/desktop && npm run build
      - run: cd apps/ade-cli && npm run build
      # The desktop app ships the CLI help digest to agents. This job already
      # has the built CLI, so the check costs one script run rather than a
      # separate build.
      - name: Check the ADE CLI help digest is current
        run: cd apps/desktop && npm run regen-cli-help -- --check
      - run: cd apps/web && npm run build

  build-runtime-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            binary: ade-darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: ade-darwin-x64
          - target: linux-x64
            os: ubuntu-latest
            binary: ade-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: ade-linux-arm64
          - target: win32-x64
            os: windows-latest
            binary: ade-win32-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm's download cache, restored on every run but saved only from main.
      # setup-node's `cache: npm` saved a separate copy for every PR (a PR's
      # cache is visible to that PR alone), which pushed the repo past its
      # 10 GB cache limit and got main's own entries evicted.
      # Ask npm where its cache is: hosted Windows runners move it to
      # C:\npm\cache, so a hard-coded path silently caches nothing.
      - name: Locate npm download cache
        id: npm_cache_dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        id: npm_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm_cache_dir.outputs.dir }}
          key: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ade-cli/package-lock.json') }}
          restore-keys: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        if: runner.os == 'macOS'
        run: echo "PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Save npm download cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.npm_cache_dir.outputs.dir }}
          key: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ade-cli/package-lock.json') }}

      - name: Build ADE runtime binary
        run: cd apps/ade-cli && npm run build:static -- --target ${{ matrix.target }}

      - name: Smoke test ADE runtime binary
        shell: bash
        run: |
          apps/ade-cli/dist-static/${{ matrix.binary }} --version
          archive="apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz"
          archive_listing="$RUNNER_TEMP/ade-${{ matrix.target }}-native-files.txt"
          tar -tzf "$archive" > "$archive_listing"
          grep -q '^\./node_modules/' "$archive_listing"
          if grep -Eq '^\./node_modules/@opencode/cli-(darwin|linux|windows)-' "$archive_listing"; then
            echo "Unexpected duplicate OpenCode platform package in native runtime archive"
            exit 1
          fi
          node apps/ade-cli/scripts/probe-runtime-crsqlite.mjs --archive "$archive" --target "${{ matrix.target }}"
          # Android streaming on a standalone brain, every OS (package-native-deps.mjs).
          grep -q '^\./android/scrcpy-server$' "$archive_listing"
          grep -q '^\./android/scrcpy-LICENSE$' "$archive_listing"

      - name: Upload ADE runtime binary
        uses: actions/upload-artifact@v4
        with:
          name: ade-runtime-${{ matrix.target }}
          path: |
            apps/ade-cli/dist-static/${{ matrix.binary }}
            apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The Linux lane-screen helper (Rust). Nothing else builds or tests it at PR
  # time, so a PR that touches it gets one build and a ping smoke test; every
  # other PR skips the work in seconds. It runs beside the long test jobs,
  # never ahead of them. main always builds it, which keeps the cargo cache
  # the release's background build restores warm.
  linux-desktop-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether the helper changed
        id: gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD || true)
          if printf '%s\n' "$changed" | grep -qE '^(apps/desktop/native/ADEDesktopDriverLinux/|apps/desktop/scripts/build-linux-desktop-driver\.mjs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Linux desktop driver changes in this PR; skipping its build."
          fi

      - name: Restore cargo cache
        if: steps.gate.outputs.run == 'true'
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: linux-desktop-driver-cargo-v1-${{ runner.arch }}-${{ hashFiles('apps/desktop/native/ADEDesktopDriverLinux/Cargo.lock') }}
          restore-keys: linux-desktop-driver-cargo-v1-${{ runner.arch }}-

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Build and smoke test
        if: steps.gate.outputs.run == 'true'
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          node apps/desktop/scripts/build-linux-desktop-driver.mjs --target linux-x64
          # Input held open a moment: the helper exits when its stdin closes.
          reply=$( (printf '{"id":"1","op":"ping"}\n'; sleep 3) \
            | timeout 20 apps/desktop/resources/native/linux-x64/ade-desktop-driver host --ade-home "$RUNNER_TEMP/ade-home")
          echo "$reply"
          grep -q '"linux"' <<< "$reply"

      - name: Save cargo cache
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: linux-desktop-driver-cargo-v1-${{ runner.arch }}-${{ hashFiles('apps/desktop/native/ADEDesktopDriverLinux/Cargo.lock') }}

  # Native Windows source gate for the filesystem, process, IPC, SQLite, and
  # capability contracts that Linux-hosted unit jobs cannot exercise.
  #
  # Runs on every push to main and on dispatch, but on a pull request only
  # when the PR carries the `windows` label. It was the slowest job by ~12
  # minutes on every PR, and over 1,000 runs its failures were almost all
  # flaky tests that also failed on unrelated branches and on main; its
  # typecheck never caught an error the Linux typecheck jobs missed, so that
  # step is gone. A Windows-relevant PR adds the label; the next push runs
  # the job (a re-run replays the old event and its old labels, so push --
  # an empty commit works).
  windows-foundation:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Caches the installed node_modules, not npm's download cache: on
      # Windows the slow part of `npm ci` is writing ~100k files, which took
      # desktop 4.5-6 minutes even with every tarball already downloaded.
      # Saved only from main, so a labelled PR reads main's entry and never
      # stores its own ~1.5 GB copy.
      - name: Restore Windows node_modules cache
        id: nm_win
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}

      - name: Install ADE CLI dependencies
        if: steps.nm_win.outputs.cache-hit != 'true'
        run: npm --prefix apps/ade-cli ci

      - name: Install desktop dependencies
        if: steps.nm_win.outputs.cache-hit != 'true'
        run: npm --prefix apps/desktop ci

      - name: Save Windows node_modules cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nm_win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/desktop/node_modules
            apps/ade-cli/node_modules
          key: nm-core-v2-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json','apps/ade-cli/package-lock.json') }}

      - name: Test Windows service, layout, and IPC contracts
        run: >-
          cd apps/ade-cli && npx vitest run
          src/bootstrap.test.ts
          src/serviceManager/common.test.ts
          src/serviceManager/installWindows.test.ts
          src/services/builtInBrowser/desktopBridgeClient.test.ts
          src/services/modelPickerStore.test.ts
          src/services/projects/machineLayout.test.ts
          src/services/projects/projectIconResolver.test.ts
          src/services/projects/projectRegistry.test.ts
          src/services/sync/syncHostSingleton.test.ts
          src/services/sync/syncLoopbackCollision.test.ts
          src/services/sync/syncService.test.ts

      - name: Test intended-user named-pipe listener contracts
        run: cd apps/ade-cli && npx vitest run src/services/runtime/localIpcListenOptions.test.ts

      # Sync-port holder identification is win32-gated: on Windows the holder
      # lookup goes through PowerShell rather than lsof/ps, and a broken lookup
      # silently disables stale-port reclaim instead of failing. Only a Windows
      # runner executes that gate.
      - name: Test Windows sync-port holder identification
        run: cd apps/ade-cli && npx vitest run src/services/sync/sharedSyncListener.test.ts

      # cli.test.ts carries the win32-gated headless-RPC named-pipe case. It is
      # green only once this layer's CLI fixes compose, so the step lives here
      # rather than in the foundation layer.
      - name: Test Windows CLI contracts
        run: cd apps/ade-cli && npx vitest run src/cli.test.ts src/lib/cliDelegation.test.ts src/services/runtime/adeCliShim.test.ts

      # Daemon supervision, restart, and version/role-compatibility. Spawns real
      # `ade serve` daemons over the platform transport, so this is the only gate
      # that exercises the always-on-brain contract on a named pipe.
      - name: Test Windows stdio RPC daemon bridge contracts
        run: cd apps/ade-cli && npx vitest run src/stdioRpcDaemon.test.ts

      # `trustedWindowsTools` is a security control whose only substantive case
      # is win32-gated, so before this step it ran on no runner at all. The
      # credential store and the `ade://` deeplink command-injection guard are
      # both filesystem- and argument-quoting sensitive, which is exactly what
      # a Linux-hosted job cannot exercise.
      - name: Test Windows trusted-tool, credential, and deeplink guards
        run: >-
          cd apps/ade-cli && npx vitest run
          src/commands/deeplinks.test.ts
          src/lib/trustedWindowsTools.test.ts
          src/services/credentials/credentialStore.test.ts

      # The standalone PowerShell installer (apps/ade-cli/scripts/install-runtime.ps1)
      # has no runnable harness off a Windows host: its POSIX twin is covered by
      # `node --test apps/ade-cli/scripts/install-runtime-rollback.test.mjs` on
      # the ubuntu job, but nothing there can parse or execute PowerShell. This
      # suite does both on a real runner -- it parses the installer through
      # `[Parser]::ParseFile` and exercises the path normalizer it shares with
      # the uninstall cleanup -- so a syntax error or a broken staging path in
      # the installer fails CI instead of a user's machine.
      - name: Test Windows standalone installer and uninstall cleanup scripts
        run: cd apps/desktop && node --test ./scripts/windows-uninstall-cleanup.test.mjs

      - name: Test Windows desktop, SQLite, and capability contracts
        run: cd apps/desktop && npx vitest run src/main/packagedRuntimeSmoke.test.ts src/main/services/computerUse/localComputerUse.test.ts src/renderer/lib/platform.test.ts

      # These suites include host-platform and PowerShell-specific prompt
      # behavior; run them on Windows so the runtime's native platform branch
      # is part of PR validation, not only a Linux simulation.
      - name: Test Windows agent prompt platform contracts
        run: cd apps/desktop && npx vitest run src/main/services/ai/tools/macDesktopPrompt.test.ts

      - name: Test Windows PowerShell session-reference prompt
        run: cd apps/desktop && npx vitest run src/main/services/chat/agentChatServiceInteractionMode.test.ts -t "activity guidance"

      # These path-equivalence assertions skip on Linux because case-only path
      # changes are meaningful there. Run them on Windows so the worker pools'
      # case-insensitive path reuse is exercised by a native filesystem target.
      - name: Test Windows SDK worker activity path contracts
        run: cd apps/desktop && npx vitest run src/main/services/chat/cursorSdkPool.test.ts src/main/services/chat/piSdkPool.test.ts src/main/services/shared/offThreadSpawn.test.ts

      # The suites docs/development/windows-port-lane.md names as the Windows
      # validation set. Before this step the intersection with this job was
      # empty, so the documented gate was never actually run on Windows.
      - name: Test Windows path, spawn, window, and update contracts
        run: >-
          cd apps/desktop && npx vitest run
          src/main/services/appControl/appControlLaunchCommand.test.ts
          src/main/services/appControl/appControlService.test.ts
          src/main/services/shared/processExecution.test.ts
          src/main/services/shared/treeWatcher.test.ts
          src/main/services/ai/cliExecutableResolver.test.ts
          src/main/services/updates/autoUpdateService.test.ts
          src/main/windowAppearance.test.ts
          src/renderer/lib/pathUtils.test.ts
          src/main/services/shared/pathCompare.test.ts
          src/main/services/chat/codexApprovalContainment.test.ts
          src/main/services/externalSessions/discoveryUtils.test.ts
          src/main/services/externalSessions/externalSessionsService.test.ts
          src/main/services/externalSessions/sessionHome.test.ts
          src/main/services/lanes/laneStorageLifecycle.test.ts
          src/main/services/lanes/deletedLaneSnapshots.test.ts
          src/main/services/chat/piSession.test.ts
          src/main/services/computerUse/artifactMediaServer.test.ts
          src/shared/pathCase.test.ts
          src/shared/pathContainment.test.ts
          src/shared/artifactStreamUrl.test.ts

      # A command a chat on another machine runs here once goes through
      # PowerShell's -EncodedCommand; only a real PowerShell proves its words
      # and exit code arrive unchanged.
      - name: Test Windows remote run-once command launch
        run: cd apps/desktop && npx vitest run src/main/services/pty/ptyService.test.ts -t "another machine runs here once"

      # Covers the Windows runtime startup timing and `connectSpawnedRuntime`
      # retry path. This suite spawns real `ade serve` daemons and connects to
      # them over the platform transport, so on this runner it is the only gate
      # that exercises the named-pipe endpoint end to end.
      - name: Test Windows local runtime connection pool contracts
        run: cd apps/desktop && npx vitest run src/main/services/localRuntime/localRuntimeConnectionPool.test.ts

      - name: Test PR-origin and attention lifecycle contracts
        run: >-
          cd apps/desktop && npx vitest run
          src/main/services/prs/prChatLinkStore.test.ts
          src/main/services/prs/prAsync.test.ts
          src/main/services/sessions/settleRaceMatrix.test.ts
          src/main/services/chat/turnEndQuestionCheck.test.ts

      # The CRDT/sync layer. These suites are gated on `isCrsqliteAvailable()`,
      # which resolves `vendor/crsqlite/<platform>-<arch>/`. darwin-arm64,
      # darwin-x64, linux-x64, linux-arm64, and win32-x64 are vendored. ubuntu
      # `test-desktop` loads linux-x64 and runs the CRR suites there; this
      # Windows job is the win32-x64 gate.
      - name: Test Windows CRDT, sync, and device registry contracts
        run: >-
          cd apps/desktop && npx vitest run
          src/main/services/state/kvDb.test.ts
          src/main/services/state/kvDb.migrations.test.ts
          src/main/services/state/kvDb.rebuildRecovery.test.ts
          src/main/services/state/kvDb.sync.test.ts
          src/main/services/sync/deviceRegistryService.test.ts
          src/main/services/sync/syncHostService.test.ts
          src/main/services/sync/syncService.test.ts

  # ── iOS build + unit tests ────────────────────────────────────────────
  # The iOS app is otherwise the only ADE surface with zero CI coverage, and
  # three consecutive merges (#1117, #1120, #1121) each landed a Swift compile
  # break that stayed invisible until someone built locally. This job keeps the
  # ADE scheme compiling and ADETests green on every change that can affect
  # them.
  #
  # It always RUNS (ci-pass treats "skipped" as failure, deliberately), but on
  # pull requests and single-commit pushes to main that do not touch
  # apps/ios/**, the shared fixtures the iOS suite reads, or this workflow it
  # exits success immediately, so non-iOS changes pay only runner spin-up.
  # workflow_dispatch and multi-commit pushes always execute the full build + test.
  # The path gate runs on Ubuntu: a gated skip on the macOS job still waited
  # minutes for a macOS runner just to exit, and it held one of the few
  # concurrent macOS slots the other jobs need.
  ios-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 2 keeps the PR merge commit's parents available, so the
          # gating step below can diff the merge against its base parent.
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether iOS is affected
        id: gate
        run: |
          set -euo pipefail
          # A PR: checkout@v4 checks out the PR merge commit, so its first
          # parent is the base and the diff is exactly what the PR changes.
          # A push to main: a merge or squash commit, whose first parent is
          # the main it was pushed onto, so the diff is what that PR changed.
          # When two PRs that touch iOS merge one after the other, the second
          # push still runs the suite, so a conflict between them is caught.
          # Anything else (a dispatch, a push of several commits, a missing
          # parent, a failed diff) runs the suite.
          case "${{ github.event_name }}" in
            pull_request) ;;
            push)
              if [[ "$(git rev-parse HEAD^1 2>/dev/null || true)" != "${{ github.event.before }}" ]]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The shared chip fixture lives under apps/desktop but the iOS suite
          # asserts against it (WorkComposerTriggerDetectorTests.
          # testMatchesSharedChipFixture). Without it in this gate, a
          # desktop-only PR that adds a row skips the Swift suite and merges
          # green, then breaks main — which is exactly the silent divergence
          # the fixture exists to prevent. The same holds for the activity
          # case tables under shared/attention (ActivityRowPresentationTests
          # reads activityStateGroup/activityBoardColumn.cases.json from disk).
          if printf '%s\n' "$changed" | grep -qE '^(apps/ios/|apps/desktop/src/shared/__fixtures__/|apps/desktop/src/shared/attention/[^/]+\.cases\.json$|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No apps/ios or shared-fixture changes; skipping the iOS build."
          fi


      # Where `test-ios` runs. The rule lives in scripts/ci/ios-runner.mjs so it
      # can be tested; this step only supplies the inputs.
      #
      # The default is GitHub's hosted `xcode-27` image (same Xcode major as
      # this Mac); a Mac Studio can take the job when it advertises spare
      # capacity. The readiness agent (scripts/ci/mac-studio-readiness.mjs)
      # stamps the Unix time it last proved the machine had free disk, free
      # memory and idle cores into `MAC_STUDIO_READY`, and stops stamping when
      # it does not. Only a stamp younger than ten minutes is trusted, so a Mac
      # that went to sleep, lost its runner or filled its disk ages out on its
      # own. An unset variable always takes that fallback.
      #
      # The router is defence in depth, not the trust boundary. A `pull_request`
      # workflow runs code from the pull request, so a fork able to rewrite this
      # job could rewrite the router too. What actually keeps a fork off the Mac
      # is the repository's fork-approval policy (Settings → Actions → "Require
      # approval for all outside collaborators"), which stops a fork workflow
      # from running at all until a maintainer approves it. Do not loosen that
      # setting while this runner exists.
      - name: Pick a runner
        id: pick
        env:
          RUN_IOS: ${{ steps.gate.outputs.run }}
          READY_AT: ${{ vars.MAC_STUDIO_READY }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: node scripts/ci/ios-runner.mjs

  test-ios:
    needs: ios-gate
    # Skipped iOS work still reports success here (ci-pass treats "skipped" as
    # failure), but on a cheap Ubuntu runner instead of a macOS one.
    runs-on: ${{ fromJSON(needs.ios-gate.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - name: No iOS changes
        if: needs.ios-gate.outputs.run != 'true'
        run: echo "No apps/ios or shared-fixture changes; skipping the iOS build."

      - uses: actions/checkout@v4
        if: needs.ios-gate.outputs.run == 'true'
        with:
          # xcodebuild executes PR-controlled build phases; it never needs
          # authenticated git, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Select Xcode 27
        if: needs.ios-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [[ -n "$latest" ]]; then
            # -n so a self-hosted Mac with no passwordless sudo warns instead of
            # hanging the job on a prompt nobody can answer.
            if ! sudo -n xcode-select -s "$latest/Contents/Developer" 2>/dev/null; then
              echo "::warning::Could not select $latest without a password; keeping the default toolchain."
            fi
          fi
          echo "Toolchain: $(xcodebuild -version | head -1) ($(xcode-select -p))"
          # The hosted `xcode-27` image and this Mac both ship Xcode 27, so a
          # mismatch means the image changed under us. Fail loudly rather than
          # testing against an SDK nobody chose.
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [[ "$major" != "27" ]]; then
            echo "::error::Expected the Xcode 27 toolchain; found $major. Update this step deliberately."
            exit 1
          fi

      # A self-hosted runner keeps ~/spm-packages between jobs, so the archive
      # round trip is pure waste there: restoring is instant, saving took 172 s
      # in the first Mac run.
      - name: Cache Swift packages
        if: needs.ios-gate.outputs.run == 'true' && runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-v1-${{ hashFiles('apps/ios/ADE.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-v1-

      # Xcode's content-addressed compilation cache, kept between runs. It
      # does not depend on file times, so a fresh checkout still hits it.
      # Measured on #2100 with the C/Objective-C half only: "Build for testing"
      # 15.4 min cold, 9.4 min warm. The Swift half was never cached until the
      # build step below started passing SWIFT_ENABLE_COMPILE_CACHE, which is
      # why warm builds stayed near cold ones. A branch reads its own last
      # cache, then main's.
      - name: Restore the compilation cache
        if: needs.ios-gate.outputs.run == 'true' && runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-cas
          key: ios-cas-v2-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ios-cas-v2-${{ github.ref_name }}-
            ios-cas-v2-main-

      # The simulator cold boot took 4-8 minutes when it started after the
      # build; booting it now overlaps the build.
      - name: Pick and boot the simulator
        if: needs.ios-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # A named device, not "the first iPhone". The runner images differ in
          # which simulators they pre-create (a self-hosted Mac can hold only
          # lane devices), and a layout test that measures a row height fails on
          # a device with a different width. Pinning makes the hosted runner and
          # the Mac build the same screen.
          json=$(xcrun simctl list devices available --json)
          dest_id=""
          dest_name=""
          for name in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro"; do
            dest_id=$(printf '%s' "$json" | jq -r --arg name "$name" \
              '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and .name == $name)][0].udid // empty')
            if [[ -n "$dest_id" ]]; then dest_name="$name"; break; fi
          done
          if [[ -z "$dest_id" ]]; then
            echo "::error::No standard iPhone simulator on this runner. Create one with: xcrun simctl create 'iPhone 17' com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator: $dest_name ($dest_id)"
          echo "IOS_SIM_ID=$dest_id" >> "$GITHUB_ENV"
          # Only a device this job boots is shut down at the end. A device
          # someone else is already using is left exactly as it was found.
          state=$(printf '%s' "$json" | jq -r --arg id "$dest_id" \
            '[.devices | to_entries[] | .value[] | select(.udid == $id)][0].state // empty')
          echo "Simulator state on arrival: ${state:-unknown}"
          if [[ "$state" == "Shutdown" ]]; then
            echo "IOS_SIM_BOOTED_BY_CI=1" >> "$GITHUB_ENV"
            xcrun simctl boot "$dest_id" || true
          fi

      - name: Choose the compilation cache location
        if: needs.ios-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            # Kept outside RUNNER_TEMP, which the runner empties between jobs.
            # A self-hosted machine can hold its own store, so the cache steps
            # above are skipped and this one survives.
            echo "ADE_IOS_CAS=$HOME/ade-ios-cas" >> "$GITHUB_ENV"
          else
            echo "ADE_IOS_CAS=$RUNNER_TEMP/ios-cas" >> "$GITHUB_ENV"
          fi

      # A concrete simulator destination builds only the arch the tests run on;
      # 'generic/platform=iOS Simulator' also compiled x86_64.
      - name: Build for testing
        if: needs.ios-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild \
            -project ADE.xcodeproj \
            -scheme ADE \
            -destination "platform=iOS Simulator,id=$IOS_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            -clonedSourcePackagesDirPath ~/spm-packages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -quiet \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            CLANG_ENABLE_COMPILE_CACHE=YES \
            COMPILATION_CACHE_CAS_PATH="$ADE_IOS_CAS" \
            build-for-testing

      # The cache only grows: each build adds what changed. Past 6 GB, start it
      # again rather than fill the disk or the repository's cache space (which
      # of the two depends on where the store lives). 6 GB, not 2.5 GB, because
      # `SWIFT_ENABLE_COMPILE_CACHE` is what makes Swift compilations cacheable
      # at all — without it the store held only the C/Objective-C half and a
      # warm build still recompiled every Swift file (measured: SwiftCompile
      # stayed at ~420 CPU-seconds with a 2 GB store restored; with the flag on
      # and the store populated it fell to 8.5).
      - name: Cap the compilation cache
        if: always() && needs.ios-gate.outputs.run == 'true' && env.ADE_IOS_CAS != ''
        run: |
          set -euo pipefail
          size_kb=$(du -sk "$ADE_IOS_CAS" 2>/dev/null | cut -f1 || echo 0)
          echo "Compilation cache: $((size_kb / 1024)) MB"
          if (( size_kb > 6291456 )); then
            # An empty folder is saved in its place, so the next run builds
            # cold once and saves a fresh cache, instead of restoring the
            # big one again.
            rm -rf "$ADE_IOS_CAS"
            mkdir -p "$ADE_IOS_CAS"
            echo "Over 6 GB; the next run starts a new cache."
          fi

      - name: Run ADETests
        if: needs.ios-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd apps/ios
          xcrun simctl bootstatus "$IOS_SIM_ID" -b
          xcodebuild \
            -project ADE.xcodeproj \
            -scheme ADE \
            -destination "platform=iOS Simulator,id=$IOS_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            -clonedSourcePackagesDirPath ~/spm-packages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -quiet \
            test-without-building

      - name: Upload test results on failure
        if: failure() && needs.ios-gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-dd/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # A hosted runner is discarded with the job; a self-hosted one keeps the
      # simulator it booted, and its memory, until something shuts it down. Only
      # a device this job booted is shut down — one an ADE lane was already
      # using is left alone.
      - name: Shut down the simulator
        if: always() && needs.ios-gate.outputs.run == 'true' && env.IOS_SIM_BOOTED_BY_CI == '1'
        run: xcrun simctl shutdown "$IOS_SIM_ID" 2>/dev/null || true

  # Pure source and workflow parsing with node: built-ins only, so it needs
  # no node_modules and starts without waiting for the install job.
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-docs.mjs
      # Asserts that every platform-gated test assertion has a runner in this
      # workflow that actually executes it, and bans the vacuous
      # `if (process.platform === ...) return;` form that reports green while
      # asserting nothing. Pure source + workflow parsing, no dependencies.
      - run: node scripts/validate-platform-gates.mjs
      # A literal NUL in a source file makes git, GitHub and agent read tools
      # treat it as binary. Source must use the `\u0000` escape instead.
      - run: node scripts/check-source-nul-bytes.mjs
      # The four Workers' Sentry scrubbers and transient-failure helpers are files kept in four places.
      - run: node scripts/check-worker-sentry-scrub.mjs
      # Every PostHog event a surface sends is in docs/analytics/tracking-plan.json,
      # every planned event is sent, and the dashboards only use sent events.
      - run: node scripts/check-analytics-tracking-plan.mjs

  # ── Gate: all jobs must pass ──────────────────────────────────────────
  ci-pass:
    if: always()
    needs:
      - install
      - secret-scan
      - typecheck-desktop
      - typecheck-ade-cli
      - typecheck-web
      - typecheck-webhook-relay
      - typecheck-push-relay
      - typecheck-tunnel-relay
      - typecheck-account-directory
      - lint-desktop
      - test-desktop
      - test-ade-cli
      - test-sdk
      - test-chat-ui
      - test-webhook-relay
      - test-push-relay
      - test-password-key-service
      - test-tunnel-relay
      - test-account-directory
      - build
      - build-runtime-binaries
      - linux-desktop-driver
      - windows-foundation
      - test-ios
      - validate-docs
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          # `toJSON(needs)` IS the `needs:` list above -- one source of truth.
          # This used to re-enumerate all 21 job names in a bash loop, which
          # inverted the failure it was meant to prevent: a job added to
          # `needs:` and forgotten in the loop was never skip-checked, silently
          # and forever. Deriving the list means it cannot drift.
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Read the results ONCE into a variable rather than streaming jq
          # straight into the loop. Under process substitution a jq that fails
          # or is missing feeds the loop zero lines and the step exits 0 --
          # fail-open, which is the one outcome a gate must never have. As a
          # command substitution under `set -e`, jq failing kills the step, and
          # the emptiness check below catches a well-formed but empty answer.
          results="$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"')"
          if [[ -z "$results" ]]; then
            echo "::error::ci-pass could not read any job results from needs"
            exit 1
          fi
          failed=0
          while IFS='=' read -r job result; do
            # windows-foundation is the one opt-in job: on a pull request it
            # runs only with the `windows` label, so skipped is its expected
            # result there. Every other event still requires it to succeed.
            if [[ "$job" == "windows-foundation" && "$result" == "skipped" && "$EVENT_NAME" == "pull_request" ]]; then
              echo "windows-foundation skipped: pull request has no windows label"
              continue
            fi
            # 'skipped' means failure too: every job in needs is unconditional,
            # so a conditional job added later cannot start passing green while
            # dead. Installers are NOT built here -- release-core.yml builds
            # macOS and Windows fresh on the release tag, exactly like macOS
            # has always worked. CI's job is tests, not packaging.
            if [[ "$result" != "success" ]]; then
              echo "::error::${job} did not succeed (${result})"
              failed=1
            fi
          done <<< "$results"
          if [[ "$failed" != "0" ]]; then exit 1; fi
          echo "All required CI jobs passed"
