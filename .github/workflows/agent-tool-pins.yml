# Proposes a new pin for each agent tool that is not in an ADE lockfile.
#
# Dependabot watches the provider SDKs that ADE installs from npm
# (.github/dependabot.yml). The tools below come from vendor hosts instead
# (apps/ade-cli/scripts/pins/<tool>.json), so Dependabot cannot see them.
# Every day this workflow asks each vendor for its newest stable version. When
# that version is newer than the pin, it re-pins the tool with
# `npm run tools:pin`, which also regenerates the tools manifest, and pushes
# the result to the branch `pins/<tool>`.
#
# One branch for each tool means one open PR for each tool: a newer release
# force-pushes the same branch and updates the same PR. Merge a pin PR only
# after a check of the new version in ADE; the pin is what every user runs.
#
# Pushes made with GITHUB_TOKEN do not start CI on their own, so the workflow
# starts ci.yml on the branch with workflow_dispatch.
name: Agent tool pins

on:
  schedule:
    # 01:37 UTC is 21:37 America/New_York (EDT), after Dependabot's 21:00 run.
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Only this tool (droid, grok, qwen, kimi, devin, antigravity, pi, copilot-cli, cursor-cli, node). Empty for all."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-tool-pins
  cancel-in-progress: false

jobs:
  pin:
    name: pin ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Each pin pushes a commit to its own branch, but all of them regenerate
      # the same manifest file; two at a time keeps vendor load low.
      max-parallel: 2
      matrix:
        tool: [droid, grok, qwen, kimi, devin, antigravity, pi, copilot-cli, cursor-cli, node]
    env:
      TOOL: ${{ matrix.tool }}
      BRANCH: pins/${{ matrix.tool }}
      # qwen and kimi read GitHub's releases API; unauthenticated calls are
      # limited to 60 an hour for each IP.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ONLY_TOOL: ${{ inputs.tool || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare the pin with the vendor's newest version
        id: check
        run: |
          set -euo pipefail
          if [ -n "${ONLY_TOOL}" ] && [ "${ONLY_TOOL}" != "${TOOL}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pin_file="apps/ade-cli/scripts/pins/${TOOL}.json"
          current="$(node -p "JSON.parse(require('fs').readFileSync('${pin_file}', 'utf8')).version")"
          latest="$(cd apps/ade-cli && node scripts/pin-tool.mjs "${TOOL}" --latest-version)"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ -z "${latest}" ] || [ "${latest}" = "${current}" ]; then
            echo "${TOOL}: pinned ${current} is the newest version."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A branch that already proposes this version needs no new download.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch --quiet origin "${BRANCH}"
            proposed="$(git show "origin/${BRANCH}:${pin_file}" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            if [ "${proposed}" = "${latest}" ]; then
              echo "${TOOL}: ${BRANCH} already proposes ${latest}."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "${TOOL}: ${current} -> ${latest}"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Pin the new version
        if: steps.check.outputs.needed == 'true'
        run: cd apps/ade-cli && node scripts/pin-tool.mjs "${TOOL}" "${{ steps.check.outputs.latest }}"

      - name: Push the branch and open or update its PR
        if: steps.check.outputs.needed == 'true'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "${TOOL}: pinning ${LATEST} changed no file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add apps/ade-cli/scripts/pins apps/ade-cli/src/services/tools/toolsManifest.generated.json
          git commit --quiet -m "deps(tools): pin ${TOOL} ${LATEST}"
          git push --force origin "${BRANCH}"

          title="deps(tools): pin ${TOOL} ${LATEST}"
          body="$(printf '%s\n' \
            "Moves ADE's pinned \`${TOOL}\` from ${CURRENT} to ${LATEST}." \
            "" \
            "Written by \`npm run tools:pin -- ${TOOL} ${LATEST}\` (pin file and tools manifest)." \
            "" \
            "Every ADE user runs this version after the PR merges. Before you merge:" \
            "1. Run ${TOOL} ${LATEST} in ADE: start a chat (or a terminal for a CLI-only tool) and check that the features ADE uses still work." \
            "2. Update the dialect, tested-version notes and docs if the new version changed anything." \
            "" \
            "A newer ${TOOL} release updates this same PR.")"
          pr="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --title "${title}" --body "${body}"
          else
            gh pr create --head "${BRANCH}" --base main --title "${title}" --body "${body}" --label dependencies
          fi
          gh workflow run ci.yml --ref "${BRANCH}"
