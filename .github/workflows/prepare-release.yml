name: Prepare release

# Platform-neutral, non-publishing validation run. It never creates or updates a
# GitHub Release. Set windows_proof when the run is being used to collect the
# signed Windows exact-SHA proof; the Windows-specific preconditions are then
# asserted before anything is built.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Accepts 1.2.3 or v1.2.3.
        required: true
        type: string
      target_sha:
        description: Exact 40-character commit SHA on main to validate.
        required: true
        type: string
      windows_proof:
        description: >-
          Collect the signed Windows exact-SHA proof. Requires
          ADE_WINDOWS_SIGNED_BUILD_ENABLED=1 and
          ADE_WINDOWS_PUBLIC_RELEASE_ENABLED other than 1. Leave false for the
          platform-neutral macOS and standalone runtime dry run.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      # Opt-in mode. Without it this workflow stays the platform-neutral dry run
      # that macOS and standalone runtime releases have always used, so it stays
      # runnable no matter how the Windows repository variables are set.
      - name: Prepare signed Windows proof mode
        if: ${{ inputs.windows_proof }}
        env:
          BUILD_WINDOWS: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED }}
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
        run: |
          set -euo pipefail

          if [ "$BUILD_WINDOWS" != "1" ]; then
            echo "::error::Signed Windows proof requires ADE_WINDOWS_SIGNED_BUILD_ENABLED=1."
            exit 1
          fi
          if [ "$PUBLISH_WINDOWS" = "1" ]; then
            echo "::error::Signed Windows proof is non-publishing. Set ADE_WINDOWS_PUBLIC_RELEASE_ENABLED=0 before running it."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Resolve version and target commit
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          version="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::Version input cannot be empty."
            exit 1
          fi

          case "$version" in
            v*) tag_name="$version" ;;
            *) tag_name="v$version" ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "::error::Tag $tag_name already exists on origin."
            exit 1
          fi

          if ! printf '%s' "$INPUT_TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::target_sha must be the exact 40-character commit SHA approved for release."
            exit 1
          fi

          requested_sha="$(printf '%s' "$INPUT_TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          resolved_sha="$(git rev-parse HEAD)"
          if [ "$resolved_sha" != "$requested_sha" ]; then
            echo "::error::Checked out $resolved_sha instead of requested commit $requested_sha."
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "target_sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/release-core.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag_name }}
      target_ref: ${{ needs.resolve.outputs.target_sha }}
      publish: false
    secrets: inherit
