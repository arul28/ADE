name: Prepare release

# Platform-neutral, non-publishing validation run. It never creates or updates a
# GitHub Release. Set windows_proof when the run is being used to collect the
# signed Windows exact-SHA proof; the Windows-specific preconditions are then
# asserted before anything is built.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Accepts 1.2.3 or v1.2.3.
        required: true
        type: string
      target_sha:
        description: Exact 40-character commit SHA on main to validate.
        required: true
        type: string
      windows_proof:
        description: >-
          Collect clean-host Windows proof evidence. Builds and signs Windows
          even while ADE_WINDOWS_PUBLIC_RELEASE_ENABLED is off, and emits the
          exact-SHA proof bundle. Leave false for the ordinary dry run, which
          still builds Windows whenever the publication gate is on.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      # Opt-in evidence collection. It never depends on a repository variable
      # state, so proof can be collected before Windows is enabled and again as
      # a regression check after it is. This workflow never publishes either way.
      - name: Prepare signed Windows proof mode
        if: ${{ inputs.windows_proof }}
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          set -euo pipefail

          if [ -z "$WINDOWS_CSC_LINK" ] || [ -z "$WINDOWS_CSC_KEY_PASSWORD" ]; then
            echo "::error::Signed Windows proof requires the WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD secrets."
            exit 1
          fi
          if [ -z "$WINDOWS_SIGNING_EXPECTED_SUBJECT" ] && [ -z "$WINDOWS_SIGNING_EXPECTED_THUMBPRINT" ]; then
            echo "::error::Signed Windows proof requires the WINDOWS_SIGNING_EXPECTED_SUBJECT or WINDOWS_SIGNING_EXPECTED_THUMBPRINT secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Resolve version and target commit
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          version="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::Version input cannot be empty."
            exit 1
          fi

          case "$version" in
            v*) tag_name="$version" ;;
            *) tag_name="v$version" ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "::error::Tag $tag_name already exists on origin."
            exit 1
          fi

          if ! printf '%s' "$INPUT_TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::target_sha must be the exact 40-character commit SHA approved for release."
            exit 1
          fi

          requested_sha="$(printf '%s' "$INPUT_TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          resolved_sha="$(git rev-parse HEAD)"
          if [ "$resolved_sha" != "$requested_sha" ]; then
            echo "::error::Checked out $resolved_sha instead of requested commit $requested_sha."
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "target_sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/release-core.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag_name }}
      target_ref: ${{ needs.resolve.outputs.target_sha }}
      publish: false
      windows_proof: ${{ inputs.windows_proof }}
    secrets: inherit
