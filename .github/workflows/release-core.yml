name: Release core

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to stamp into the desktop app version.
        required: true
        type: string
      target_ref:
        description: Commit SHA or ref to build and release.
        required: true
        type: string
      publish:
        description: Whether to upload validated artifacts to a draft GitHub release.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Ensure release commit points to main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Ensure CI passed for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          ci_pass_json="$(
            gh api "repos/$GH_REPO/commits/$TARGET_REF/check-runs" \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -f per_page=100 \
              --paginate \
              --jq '[.check_runs[] | select(.name == "ci-pass")] | sort_by(.completed_at // "") | last // empty'
          )"

          if [ -z "$ci_pass_json" ] || [ "$ci_pass_json" = "null" ]; then
            echo "::error::No ci-pass check run was found for $TARGET_REF. Run CI before releasing."
            exit 1
          fi

          status="$(printf '%s' "$ci_pass_json" | jq -r '.status // ""')"
          conclusion="$(printf '%s' "$ci_pass_json" | jq -r '.conclusion // ""')"
          url="$(printf '%s' "$ci_pass_json" | jq -r '.html_url // ""')"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::ci-pass for $TARGET_REF is $status/$conclusion. Release packaging requires green CI. $url"
            exit 1
          fi

          echo "ci-pass succeeded for $TARGET_REF: $url"

      - name: Validate Windows release configuration
        env:
          BUILD_WINDOWS: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED }}
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
          WINDOWS_UPDATE_PROOF_APPROVED: ${{ vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED }}
        run: |
          if [ "$PUBLISH_WINDOWS" = "1" ] && [ "$BUILD_WINDOWS" != "1" ]; then
            echo "::error::ADE_WINDOWS_PUBLIC_RELEASE_ENABLED=1 requires ADE_WINDOWS_SIGNED_BUILD_ENABLED=1."
            exit 1
          fi
          if [ "$PUBLISH_WINDOWS" = "1" ] && [ "$WINDOWS_UPDATE_PROOF_APPROVED" != "1" ]; then
            echo "::error::ADE_WINDOWS_PUBLIC_RELEASE_ENABLED=1 requires approved two-version installed-update proof."
            exit 1
          fi

  build-mac-release:
    needs:
      - verify
      - build-runtime-binaries
    # One job per arch, in parallel on native runners (arm64 -> macos-15,
    # x64 -> macos-15-intel). Wall-clock ~= one arch's build+notarize instead of
    # both serialized. Each job signs+notarizes+staples its own arch; the
    # per-arch updater manifests are merged in publish-release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-${{ inputs.release_tag }}-mac-${{ matrix.arch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/ade-cli/package-lock.json

      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: apps/desktop/resources/runtime
          merge-multiple: true

      - name: Materialize ADE runtime resources
        env:
          ADE_RUNTIME_ARTIFACTS_DIR: ${{ github.workspace }}/apps/desktop/resources/runtime
        run: cd apps/desktop && npm run materialize:runtime-resources

      - name: Stamp release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd apps/desktop && npm run version:release

      - name: Reset release output
        run: |
          rm -rf apps/desktop/release apps/desktop/.cache
          mkdir -p apps/desktop/.cache

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error::Missing APPLE_API_KEY_P8 or APPLE_API_KEY_ID GitHub secret."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Materialize Developer ID provisioning profile
        env:
          MACOS_DEVELOPER_ID_PROFILE_B64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_B64 }}
        run: |
          if [ -z "$MACOS_DEVELOPER_ID_PROFILE_B64" ]; then
            echo "::error::Missing MACOS_DEVELOPER_ID_PROFILE_B64 GitHub secret."
            exit 1
          fi

          PROFILE_PATH="$GITHUB_WORKSPACE/apps/desktop/build/ade-desktop.provisionprofile"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > /dev/null

      - name: Reject insecure macOS signing certificate URL
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          fi

      - name: Import app Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing CSC_LINK or CSC_KEY_PASSWORD GitHub secret."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/app-signing.p12"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          elif [[ "$CSC_LINK" == https://* ]]; then
            curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
          elif [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          fi

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build signed ${{ matrix.arch }} macOS release
        env:
          # These archives were signed and notarized by their native
          # build-runtime-binaries matrix jobs. Verify them here instead of
          # re-signing and re-timestamping foreign-arch payloads.
          ADE_RUNTIME_ARCHIVES_PRE_SIGNED: "1"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          ELECTRON_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron-builder
        run: cd apps/desktop && npm run dist:mac:${{ matrix.arch }}:signed

      - name: Notarize and staple ${{ matrix.arch }} DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cd apps/desktop && npm run notarize:mac:dmg

      - name: Validate ${{ matrix.arch }} release artifacts
        run: cd apps/desktop && npm run validate:mac:artifacts

      - name: Rename per-arch updater manifest
        run: cd apps/desktop && mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-mac-release-${{ inputs.release_tag }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  build-win-release:
    if: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED == '1' }}
    needs:
      - verify
      - build-runtime-binaries
    runs-on: windows-latest
    concurrency:
      group: release-${{ inputs.release_tag }}-win
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/ade-cli/package-lock.json

      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Require Windows Authenticode signing secrets
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_KEY_PASSWORD)) {
            throw "Public Windows releases require WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_EXPECTED_SUBJECT) -and [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_EXPECTED_THUMBPRINT)) {
            throw "Public Windows releases require WINDOWS_SIGNING_EXPECTED_SUBJECT or WINDOWS_SIGNING_EXPECTED_THUMBPRINT."
          }
      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: apps/desktop/resources/runtime
          merge-multiple: true

      - name: Materialize ADE runtime resources
        env:
          ADE_RUNTIME_ARTIFACTS_DIR: ${{ github.workspace }}\apps\desktop\resources\runtime
        run: cd apps/desktop && npm run materialize:runtime-resources

      - name: Stamp release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd apps/desktop && npm run version:release

      - name: Reset release output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force apps/desktop/release, apps/desktop/.cache -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path apps/desktop/.cache | Out-Null

      - name: Build and validate Windows release
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron-builder
          ADE_RELEASE_REPOSITORY: ${{ github.repository }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: cd apps/desktop && npm run dist:win:signed

      - name: Test installed signed Windows product lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/release/ADE-*-win-x64.exe -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one signed Windows installer, found $($installers.Count)." }
          & apps/desktop/scripts/windows-installed-product-smoke.ps1 -InstallerPath $installers[0].FullName

      - name: Upload validated Windows artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ade-win-release-${{ inputs.release_tag }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  build-runtime-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            binary: ade-darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: ade-darwin-x64
          - target: linux-x64
            os: ubuntu-latest
            binary: ade-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: ade-linux-arm64
          - target: win32-x64
            os: windows-latest
            binary: ade-win32-x64.exe
    runs-on: ${{ matrix.os }}
    concurrency:
      group: release-${{ inputs.release_tag }}-runtime-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ade-cli/package-lock.json

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        if: runner.os == 'macOS'
        run: echo "PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Stamp runtime release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node apps/desktop/scripts/set-release-version.mjs

      - name: Build ADE runtime binary
        env:
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
        run: cd apps/ade-cli && npm run build:static -- --target ${{ matrix.target }}

      - name: Sign and validate standalone Windows runtime
        if: ${{ matrix.target == 'win32-x64' && vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED == '1' }}
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          & apps/ade-cli/scripts/sign-windows-runtime.ps1 `
            -BinaryPath "apps/ade-cli/dist-static/${{ matrix.binary }}"

      - name: Materialize runtime notarization API key
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error::Missing APPLE_API_KEY_P8 or APPLE_API_KEY_ID GitHub secret."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import runtime Developer ID certificate
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing CSC_LINK or CSC_KEY_PASSWORD GitHub secret."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/runtime-signing.p12"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          elif [[ "$CSC_LINK" == https://* ]]; then
            curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
          elif [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          fi

          KEYCHAIN="$RUNNER_TEMP/runtime-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Sign and notarize ADE runtime binary
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cd apps/ade-cli && npm run notarize:static -- --binary=dist-static/ade-${{ matrix.target }}

      - name: Smoke test ADE runtime binary
        shell: bash
        run: |
          apps/ade-cli/dist-static/${{ matrix.binary }} --version
          archive="apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz"
          archive_listing="$RUNNER_TEMP/ade-${{ matrix.target }}-native-files.txt"
          tar -tzf "$archive" > "$archive_listing"
          grep -q '^\./node_modules/' "$archive_listing"
          if grep -Eq '^\./node_modules/opencode-(darwin|linux|windows)-' "$archive_listing"; then
            echo "Unexpected duplicate OpenCode platform package in native runtime archive"
            exit 1
          fi

      - name: Assemble signed Windows standalone proof bundle
        if: ${{ matrix.target == 'win32-x64' && vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          cp apps/ade-cli/scripts/install-runtime.ps1 apps/ade-cli/dist-static/install.ps1
          (
            cd apps/ade-cli/dist-static
            sha256sum install.ps1 ade-win32-x64.exe ade-win32-x64.native.tar.gz \
              | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload ADE runtime binary
        uses: actions/upload-artifact@v4
        with:
          name: ade-runtime-${{ matrix.target }}
          path: |
            apps/ade-cli/dist-static/${{ matrix.binary }}
            apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz
            apps/ade-cli/dist-static/install.ps1
            apps/ade-cli/dist-static/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish-release:
    if: >-
      ${{
        always()
        && inputs.publish
        && needs.build-runtime-binaries.result == 'success'
        && needs.build-mac-release.result == 'success'
        && (
          vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED != '1'
          || (
            vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED == '1'
            && needs.build-win-release.result == 'success'
          )
        )
      }}
    needs:
      - build-runtime-binaries
      - build-mac-release
      - build-win-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download per-arch macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ade-mac-release-${{ inputs.release_tag }}-*
          path: release-assets/mac
          merge-multiple: true

      - name: Merge per-arch updater manifests into latest-mac.yml
        run: |
          set -euo pipefail
          # Each per-arch build uploaded latest-mac-<arch>.yml; merge them into a
          # single latest-mac.yml whose files[] lists both arch zips (electron-updater
          # picks the right one by arch). --ignore-scripts skips the heavy electron
          # postinstall — we only need the pure-JS `yaml` dep for the merge.
          (cd apps/desktop && npm ci --ignore-scripts)
          node apps/desktop/scripts/merge-mac-latest-yml.mjs \
            release-assets/mac/latest-mac-arm64.yml \
            release-assets/mac/latest-mac-x64.yml \
            release-assets/mac/latest-mac.yml
          rm -f release-assets/mac/latest-mac-arm64.yml release-assets/mac/latest-mac-x64.yml

      - name: Download Windows release artifacts
        if: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED == '1' && vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' && vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: ade-win-release-${{ inputs.release_tag }}
          path: release-assets/win

      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: release-assets/runtime
          merge-multiple: true

      - name: Add standalone runtime installer
        env:
          BUILD_WINDOWS: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED }}
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
          WINDOWS_UPDATE_PROOF_APPROVED: ${{ vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED }}
        run: |
          cp apps/ade-cli/scripts/install-runtime.sh release-assets/runtime/install.sh
          chmod 755 release-assets/runtime/install.sh
          if [ "$BUILD_WINDOWS" = "1" ] && [ "$PUBLISH_WINDOWS" = "1" ] && [ "$WINDOWS_UPDATE_PROOF_APPROVED" = "1" ]; then
            cp apps/ade-cli/scripts/install-runtime.ps1 release-assets/runtime/install.ps1
          fi

      - name: Generate standalone runtime checksums
        env:
          BUILD_WINDOWS: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED }}
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
          WINDOWS_UPDATE_PROOF_APPROVED: ${{ vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED }}
        run: |
          set -euo pipefail
          runtime_assets=(
            install.sh
            ade-darwin-arm64
            ade-darwin-arm64.native.tar.gz
            ade-darwin-x64
            ade-darwin-x64.native.tar.gz
            ade-linux-arm64
            ade-linux-arm64.native.tar.gz
            ade-linux-x64
            ade-linux-x64.native.tar.gz
          )
          if [ "$BUILD_WINDOWS" = "1" ] && [ "$PUBLISH_WINDOWS" = "1" ] && [ "$WINDOWS_UPDATE_PROOF_APPROVED" = "1" ]; then
            runtime_assets+=(install.ps1 ade-win32-x64.exe ade-win32-x64.native.tar.gz)
          fi
          (cd release-assets/runtime && sha256sum "${runtime_assets[@]}" | LC_ALL=C sort -k2 > SHA256SUMS)

      - name: Validate publish asset manifest
        run: |
          set -euo pipefail
          shopt -s nullglob

          require_file() {
            local file="$1"
            local label="${2:-$1}"
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty $label: $file"
              exit 1
            fi
          }

          require_glob() {
            local pattern="$1"
            local label="${2:-$1}"
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::Missing $label matching $pattern"
              exit 1
            fi
            for file in "${matches[@]}"; do
              require_file "$file" "$label"
            done
          }

          require_glob 'release-assets/mac/*.dmg' 'macOS DMG'
          require_glob 'release-assets/mac/*.zip' 'macOS zip'
          require_file 'release-assets/mac/latest-mac.yml' 'macOS auto-update metadata'

          require_file 'release-assets/runtime/install.sh' 'standalone runtime installer'
          if [ ! -x 'release-assets/runtime/install.sh' ]; then
            echo "::error::Standalone runtime installer is not executable."
            exit 1
          fi
          require_file 'release-assets/runtime/SHA256SUMS' 'standalone runtime checksum manifest'
          (cd release-assets/runtime && sha256sum -c SHA256SUMS)

          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            binary="release-assets/runtime/ade-$target"
            require_file "$binary" "ADE runtime binary for $target"
            require_file "release-assets/runtime/ade-$target.native.tar.gz" "ADE native dependency archive for $target"
            archive_listing="$RUNNER_TEMP/ade-$target-native-files.txt"
            tar -tzf "release-assets/runtime/ade-$target.native.tar.gz" > "$archive_listing"
            grep -q '^\./node_modules/' "$archive_listing" || {
              echo "::error::ADE native dependency archive for $target is missing node_modules."
              exit 1
            }
          done

      - name: Validate gated Windows publish asset manifest
        if: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED == '1' && vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' && vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED == '1' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release-assets/win/*.exe)
          blockmaps=(release-assets/win/*.exe.blockmap)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#blockmaps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed Windows installer and blockmap."
            exit 1
          fi
          test -s "${installers[0]}"
          test -s "${blockmaps[0]}"
          test -s release-assets/win/latest.yml
          test -s release-assets/runtime/install.ps1
          test -s release-assets/runtime/ade-win32-x64.exe
          test -s release-assets/runtime/ade-win32-x64.native.tar.gz
          grep -Eq '[[:space:]]install\.ps1$' release-assets/runtime/SHA256SUMS
          grep -Eq '[[:space:]]ade-win32-x64\.exe$' release-assets/runtime/SHA256SUMS
          grep -Eq '[[:space:]]ade-win32-x64\.native\.tar\.gz$' release-assets/runtime/SHA256SUMS
      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
          TARGET_REF: ${{ inputs.target_ref }}
          GH_REPO: ${{ github.repository }}
          BUILD_WINDOWS: ${{ vars.ADE_WINDOWS_SIGNED_BUILD_ENABLED }}
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
          WINDOWS_UPDATE_PROOF_APPROVED: ${{ vars.ADE_WINDOWS_INSTALLED_UPDATE_PROOF_APPROVED }}
        run: |
          shopt -s nullglob
          # The per-arch macOS zips + latest-mac.yml are what electron-updater
          # consumes; DMGs are the human downloads. Mac blockmaps stay omitted.
          # When the post-upgrade proof gate is enabled, Windows adds its signed
          # installer, blockmap, and latest.yml as one validated draft-release set.
          files=(
            release-assets/mac/*.dmg
            release-assets/mac/*.zip
            release-assets/mac/latest-mac.yml
            release-assets/runtime/install.sh
            release-assets/runtime/SHA256SUMS
            release-assets/runtime/ade-darwin-*
            release-assets/runtime/ade-linux-*
          )

          # This repository variable stays disabled until the signed installer
          # passes the clean-host release checks.
          if [ "$BUILD_WINDOWS" = "1" ] && [ "$PUBLISH_WINDOWS" = "1" ] && [ "$WINDOWS_UPDATE_PROOF_APPROVED" = "1" ]; then
            files+=(
              release-assets/win/*.exe
              release-assets/win/*.exe.blockmap
              release-assets/win/latest.yml
              release-assets/runtime/install.ps1
              release-assets/runtime/ade-win32-x64.exe
              release-assets/runtime/ade-win32-x64.native.tar.gz
            )
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts were found after validation."
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG_NAME is already public. Refusing to overwrite published assets."
              exit 1
            fi
            if [ "$BUILD_WINDOWS" != "1" ] || [ "$PUBLISH_WINDOWS" != "1" ] || [ "$WINDOWS_UPDATE_PROOF_APPROVED" != "1" ]; then
              mapfile -t existing_assets < <(
                gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name'
              )
              for asset in "${existing_assets[@]}"; do
                case "$asset" in
                  install.ps1|ade-win32-x64.exe|ade-win32-x64.native.tar.gz|ADE*-win-x64.exe|ADE*-win-x64.exe.blockmap|latest.yml)
                    gh release delete-asset "$TAG_NAME" "$asset" --repo "$GH_REPO" --yes
                    ;;
                esac
              done
            fi
            gh release upload "$TAG_NAME" "${files[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --repo "$GH_REPO" \
              --draft \
              --title "$TAG_NAME" \
              --generate-notes \
              --target "$TARGET_REF"
          fi
