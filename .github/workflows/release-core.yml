name: Release core

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to stamp into the desktop app version.
        required: true
        type: string
      target_ref:
        description: Commit SHA or ref to build and release.
        required: true
        type: string
      publish:
        description: Whether to upload validated artifacts to a draft GitHub release.
        required: false
        default: false
        type: boolean
      windows_proof:
        description: >-
          Collect clean-host Windows proof evidence. Builds Windows even while
          ADE_WINDOWS_PUBLIC_RELEASE_ENABLED is off and emits the exact-SHA
          proof manifest bundle. Deliberate evidence collection only; it does
          not gate ordinary releases.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Validate release tag and target binding
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag must use the canonical v1.2.3 or v1.2.3-prerelease form."
            exit 1
          fi

          target_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG" | tr '[:upper:]' '[:lower:]')"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "::error::Release tag $RELEASE_TAG resolves to $tag_sha, not approved target $target_sha."
              exit 1
            fi
          fi

      - name: Ensure release commit points to main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Ensure CI passed for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          ci_pass_json="$(
            gh api "repos/$GH_REPO/commits/$TARGET_REF/check-runs" \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -f per_page=100 \
              --paginate \
              --jq '[.check_runs[] | select(.name == "ci-pass")] | sort_by(.completed_at // "") | last // empty'
          )"

          if [ -z "$ci_pass_json" ] || [ "$ci_pass_json" = "null" ]; then
            echo "::error::No ci-pass check run was found for $TARGET_REF. Run CI before releasing."
            exit 1
          fi

          status="$(printf '%s' "$ci_pass_json" | jq -r '.status // ""')"
          conclusion="$(printf '%s' "$ci_pass_json" | jq -r '.conclusion // ""')"
          url="$(printf '%s' "$ci_pass_json" | jq -r '.html_url // ""')"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::ci-pass for $TARGET_REF is $status/$conclusion. Release packaging requires green CI. $url"
            exit 1
          fi

          echo "ci-pass succeeded for $TARGET_REF: $url"

      # Windows builds fresh on the tag, the same way macOS does. There is one
      # maintainer-facing switch, ADE_WINDOWS_PUBLIC_RELEASE_ENABLED, plus the
      # deliberate windows_proof dispatch input for clean-host evidence runs.
      # Fail here, a minute in, rather than after a full Windows package build.
      - name: Validate Windows release configuration
        env:
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
          WINDOWS_PROOF: ${{ inputs.windows_proof }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH_WINDOWS" != "1" ] && [ "$WINDOWS_PROOF" != "true" ]; then
            echo "Windows release is disabled for this run. Set ADE_WINDOWS_PUBLIC_RELEASE_ENABLED=1 to publish Windows assets."
            exit 0
          fi

          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ]; then
            echo "::error::Windows releases require the AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET secrets."
            exit 1
          fi
          if [ -z "$WINDOWS_SIGNING_EXPECTED_SUBJECT" ]; then
            echo "::error::Windows releases require the WINDOWS_SIGNING_EXPECTED_SUBJECT secret to pin the approved publisher."
            exit 1
          fi
          # Azure Artifact Signing renews the certificate daily and expires it
          # after 72 hours, so a thumbprint pin would start failing releases
          # within days. Refuse the secret rather than ignore it.
          if [ -n "$WINDOWS_SIGNING_EXPECTED_THUMBPRINT" ]; then
            echo "::error::WINDOWS_SIGNING_EXPECTED_THUMBPRINT is not supported by the Azure Artifact Signing pipeline. Delete the secret and pin WINDOWS_SIGNING_EXPECTED_SUBJECT instead."
            exit 1
          fi

  build-mac-release:
    needs:
      - verify
      - build-runtime-binaries
    # One job per arch, in parallel on native runners (arm64 -> macos-15,
    # x64 -> macos-15-intel). Wall-clock ~= one arch's build+notarize instead of
    # both serialized. Each job signs+notarizes+staples its own arch; the
    # per-arch updater manifests are merged in publish-release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-${{ inputs.release_tag }}-mac-${{ matrix.arch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/ade-cli/package-lock.json

      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: apps/desktop/resources/runtime
          merge-multiple: true

      - name: Materialize ADE runtime resources
        env:
          ADE_RUNTIME_ARTIFACTS_DIR: ${{ github.workspace }}/apps/desktop/resources/runtime
        run: cd apps/desktop && npm run materialize:runtime-resources

      - name: Stamp release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd apps/desktop && npm run version:release

      - name: Reset release output
        run: |
          rm -rf apps/desktop/release apps/desktop/.cache
          mkdir -p apps/desktop/.cache

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error::Missing APPLE_API_KEY_P8 or APPLE_API_KEY_ID GitHub secret."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Materialize Developer ID provisioning profile
        env:
          MACOS_DEVELOPER_ID_PROFILE_B64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_B64 }}
        run: |
          if [ -z "$MACOS_DEVELOPER_ID_PROFILE_B64" ]; then
            echo "::error::Missing MACOS_DEVELOPER_ID_PROFILE_B64 GitHub secret."
            exit 1
          fi

          PROFILE_PATH="$GITHUB_WORKSPACE/apps/desktop/build/ade-desktop.provisionprofile"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > /dev/null

      - name: Reject insecure macOS signing certificate URL
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          fi

      - name: Import app Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing CSC_LINK or CSC_KEY_PASSWORD GitHub secret."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/app-signing.p12"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          elif [[ "$CSC_LINK" == https://* ]]; then
            curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
          elif [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          fi

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build signed ${{ matrix.arch }} macOS release
        env:
          # These archives were signed and notarized by their native
          # build-runtime-binaries matrix jobs. Verify them here instead of
          # re-signing and re-timestamping foreign-arch payloads.
          ADE_RUNTIME_ARCHIVES_PRE_SIGNED: "1"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          ELECTRON_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron-builder
        run: cd apps/desktop && npm run dist:mac:${{ matrix.arch }}:signed

      - name: Notarize and staple ${{ matrix.arch }} DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cd apps/desktop && npm run notarize:mac:dmg

      - name: Validate ${{ matrix.arch }} release artifacts
        run: cd apps/desktop && npm run validate:mac:artifacts

      - name: Rename per-arch updater manifest
        run: cd apps/desktop && mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-mac-release-${{ inputs.release_tag }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  build-win-release:
    # Same shape as build-mac-release: the tagged commit is built, signed and
    # validated in-run, and its output is published by publish-release. The
    # windows_proof input additionally builds Windows while the publication gate
    # is still off, so clean-host evidence can be collected deliberately.
    if: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' || inputs.windows_proof }}
    needs:
      - verify
      - build-runtime-binaries
    runs-on: windows-latest
    concurrency:
      group: release-${{ inputs.release_tag }}-win-x64
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/ade-cli/package-lock.json

      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Require Windows Authenticode signing secrets
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) -or [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET)) {
            throw "Public Windows releases require AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_EXPECTED_SUBJECT)) {
            throw "Public Windows releases require WINDOWS_SIGNING_EXPECTED_SUBJECT."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_EXPECTED_THUMBPRINT)) {
            throw "WINDOWS_SIGNING_EXPECTED_THUMBPRINT is not supported by the Azure Artifact Signing pipeline; pin WINDOWS_SIGNING_EXPECTED_SUBJECT instead."
          }

      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: apps/desktop/resources/runtime
          merge-multiple: true

      - name: Materialize ADE runtime resources
        env:
          ADE_RUNTIME_ARTIFACTS_DIR: ${{ github.workspace }}\apps\desktop\resources\runtime
        run: cd apps/desktop && npm run materialize:runtime-resources

      - name: Stamp release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd apps/desktop && npm run version:release

      - name: Reset release output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force apps/desktop/release, apps/desktop/.cache -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path apps/desktop/.cache | Out-Null

      - name: Build and validate Windows release
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron-builder
          ADE_RELEASE_REPOSITORY: ${{ github.repository }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          # Azure Artifact Signing service principal. EnvironmentCredential
          # reads exactly these three names and is tried ahead of the managed
          # identity probe that a GitHub-hosted runner cannot answer.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        run: cd apps/desktop && npm run dist:win:signed

      - name: Test installed signed Windows product lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "apps/desktop/release/ADE-[0-9]*-win-x64.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one signed Windows installer, found $($installers.Count)." }
          & apps/desktop/scripts/windows-installed-product-smoke.ps1 -InstallerPath $installers[0].FullName

      - name: Upload validated Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-win-release-${{ inputs.release_tag }}
          path: |
            apps/desktop/release/ADE-*-win-x64.exe
            apps/desktop/release/ADE-*-win-x64.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

      # Everything below is deliberate clean-host evidence collection. It builds
      # the redacted proof bundle and its exact-SHA manifest, and never gates an
      # ordinary release. The machine-checkable Windows gates all ran above:
      # the job-level signing-secret requirement, --require-signing in
      # run-electron-builder.mjs, --require-signed Authenticode verification in
      # validate-win-artifacts.mjs, and the installed-product lifecycle smoke.
      - name: Stage standalone runtime proof assets
        if: ${{ inputs.windows_proof }}
        shell: pwsh
        run: |
          $releaseDir = "apps/desktop/release"
          Copy-Item -LiteralPath "apps/ade-cli/scripts/install-runtime.sh" -Destination "$releaseDir/install.sh"
          Copy-Item -LiteralPath "apps/ade-cli/scripts/install-runtime.ps1" -Destination "$releaseDir/install.ps1"
          $runtimeFiles = @(
            "ade-darwin-arm64",
            "ade-darwin-arm64.native.tar.gz",
            "ade-darwin-x64",
            "ade-darwin-x64.native.tar.gz",
            "ade-linux-arm64",
            "ade-linux-arm64.native.tar.gz",
            "ade-linux-x64",
            "ade-linux-x64.native.tar.gz",
            "ade-win32-x64.exe",
            "ade-win32-x64.native.tar.gz"
          )
          $actualRuntimeFiles = @(
            Get-ChildItem -LiteralPath "apps/desktop/resources/runtime" -File -Filter "ade-*" |
              ForEach-Object Name |
              Sort-Object
          )
          $unexpectedRuntimeFiles = @($actualRuntimeFiles | Where-Object { $_ -notin $runtimeFiles })
          $missingRuntimeFiles = @($runtimeFiles | Where-Object { $_ -notin $actualRuntimeFiles })
          if ($unexpectedRuntimeFiles.Count -gt 0 -or $missingRuntimeFiles.Count -gt 0) {
            throw "Runtime artifact inventory mismatch. Missing: $($missingRuntimeFiles -join ', '); unexpected: $($unexpectedRuntimeFiles -join ', ')."
          }
          foreach ($runtimeFile in $runtimeFiles) {
            Copy-Item -LiteralPath "apps/desktop/resources/runtime/$runtimeFile" -Destination $releaseDir
          }
          $checksumFiles = @(
            Get-Item -LiteralPath "$releaseDir/install.sh"
            Get-Item -LiteralPath "$releaseDir/install.ps1"
            $runtimeFiles | ForEach-Object { Get-Item -LiteralPath "$releaseDir/$_" }
          ) | Sort-Object Name
          $checksumLines = $checksumFiles | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path $releaseDir) "SHA256SUMS"),
            $checksumLines,
           [System.Text.UTF8Encoding]::new($false)
          )

      - name: Generate exact-SHA Windows proof manifest
        if: ${{ inputs.windows_proof }}
        shell: pwsh
        run: >-
          node apps/desktop/scripts/windows-proof-manifest.mjs create
          --output apps/desktop/release/windows-proof-manifest.json
          --release-dir apps/desktop/release
          --target-sha "${{ inputs.target_ref }}"
          --release-tag "${{ inputs.release_tag }}"
          --repository "${{ github.repository }}"
          --workflow-name "${{ github.workflow }}"
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --workflow-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Validate exact-SHA Windows build proof
        if: ${{ inputs.windows_proof }}
        shell: pwsh
        run: >-
          node apps/desktop/scripts/windows-proof-manifest.mjs validate
          --manifest apps/desktop/release/windows-proof-manifest.json
          --phase build
          --expected-sha "${{ inputs.target_ref }}"
          --expected-tag "${{ inputs.release_tag }}"
          --expected-run-id "${{ github.run_id }}"
          --artifact-root apps/desktop/release

      - name: Upload validated Windows proof bundle
        if: ${{ inputs.windows_proof }}
        uses: actions/upload-artifact@v4
        with:
          name: ade-win-proof-${{ inputs.release_tag }}
          # Clean-host evidence is reviewed by a human days or weeks after the
          # run. Pinned instead of inherited so a lowered repository or
          # organization default cannot expire the bundle mid-review.
          # Keep this in sync with docs/playbooks/windows-signed-release.md.
          retention-days: 90
          path: |
            apps/desktop/release/ADE-*-win-x64.exe
            apps/desktop/release/ADE-*-win-x64.exe.blockmap
            apps/desktop/release/ade-darwin-arm64
            apps/desktop/release/ade-darwin-arm64.native.tar.gz
            apps/desktop/release/ade-darwin-x64
            apps/desktop/release/ade-darwin-x64.native.tar.gz
            apps/desktop/release/ade-linux-arm64
            apps/desktop/release/ade-linux-arm64.native.tar.gz
            apps/desktop/release/ade-linux-x64
            apps/desktop/release/ade-linux-x64.native.tar.gz
            apps/desktop/release/ade-win32-x64.exe
            apps/desktop/release/ade-win32-x64.native.tar.gz
            apps/desktop/release/install.sh
            apps/desktop/release/install.ps1
            apps/desktop/release/SHA256SUMS
            apps/desktop/release/latest.yml
            apps/desktop/release/windows-proof-manifest.json
          if-no-files-found: error

  build-runtime-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            binary: ade-darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: ade-darwin-x64
          - target: linux-x64
            os: ubuntu-latest
            binary: ade-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: ade-linux-arm64
          - target: win32-x64
            os: windows-latest
            binary: ade-win32-x64.exe
    runs-on: ${{ matrix.os }}
    concurrency:
      group: release-${{ inputs.release_tag }}-runtime-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ade-cli/package-lock.json

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        if: runner.os == 'macOS'
        run: echo "PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Stamp runtime release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node apps/desktop/scripts/set-release-version.mjs

      - name: Build ADE runtime binary
        env:
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
        run: cd apps/ade-cli && npm run build:static -- --target ${{ matrix.target }}

      - name: Sign and validate standalone Windows runtime
        if: ${{ matrix.target == 'win32-x64' && (vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' || inputs.windows_proof) }}
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        run: |
          & apps/ade-cli/scripts/sign-windows-runtime.ps1 `
            -BinaryPath "apps/ade-cli/dist-static/${{ matrix.binary }}"

      - name: Materialize runtime notarization API key
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error::Missing APPLE_API_KEY_P8 or APPLE_API_KEY_ID GitHub secret."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import runtime Developer ID certificate
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing CSC_LINK or CSC_KEY_PASSWORD GitHub secret."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/runtime-signing.p12"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          elif [[ "$CSC_LINK" == https://* ]]; then
            curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
          elif [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          fi

          KEYCHAIN="$RUNNER_TEMP/runtime-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Sign and notarize ADE runtime binary
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cd apps/ade-cli && npm run notarize:static -- --binary=dist-static/ade-${{ matrix.target }}

      - name: Smoke test ADE runtime binary
        shell: bash
        run: |
          apps/ade-cli/dist-static/${{ matrix.binary }} --version
          archive="apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz"
          archive_listing="$RUNNER_TEMP/ade-${{ matrix.target }}-native-files.txt"
          tar -tzf "$archive" > "$archive_listing"
          grep -q '^\./node_modules/' "$archive_listing"
          if grep -Eq '^\./node_modules/opencode-(darwin|linux|windows)-' "$archive_listing"; then
            echo "Unexpected duplicate OpenCode platform package in native runtime archive"
            exit 1
          fi

      - name: Assemble signed Windows standalone runtime bundle
        if: ${{ matrix.target == 'win32-x64' && (vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' || inputs.windows_proof) }}
        shell: bash
        run: |
          set -euo pipefail
          cp apps/ade-cli/scripts/install-runtime.ps1 apps/ade-cli/dist-static/install.ps1
          (
            cd apps/ade-cli/dist-static
            sha256sum install.ps1 ade-win32-x64.exe ade-win32-x64.native.tar.gz \
              | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload ADE runtime binary
        uses: actions/upload-artifact@v4
        with:
          name: ade-runtime-${{ matrix.target }}
          path: |
            apps/ade-cli/dist-static/${{ matrix.binary }}
            apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz
            apps/ade-cli/dist-static/install.ps1
            apps/ade-cli/dist-static/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish-release:
    # Windows is a first-class release platform: when its gate is on, a failed
    # or skipped Windows build blocks the draft exactly as a failed macOS build
    # does. always() is still needed so the job evaluates when build-win-release
    # is legitimately skipped with the gate off.
    if: >-
      ${{
        always()
        && inputs.publish
        && needs.build-runtime-binaries.result == 'success'
        && needs.build-mac-release.result == 'success'
        && (
          vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED != '1'
          || needs.build-win-release.result == 'success'
        )
      }}
    needs:
      - build-runtime-binaries
      - build-mac-release
      - build-win-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download per-arch macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ade-mac-release-${{ inputs.release_tag }}-*
          path: release-assets/mac
          merge-multiple: true

      - name: Merge per-arch updater manifests into latest-mac.yml
        run: |
          set -euo pipefail
          # Each per-arch build uploaded latest-mac-<arch>.yml; merge them into a
          # single latest-mac.yml whose files[] lists both arch zips (electron-updater
          # picks the right one by arch). --ignore-scripts skips the heavy electron
          # postinstall — we only need the pure-JS `yaml` dep for the merge.
          (cd apps/desktop && npm ci --ignore-scripts)
          node apps/desktop/scripts/merge-mac-latest-yml.mjs \
            release-assets/mac/latest-mac-arm64.yml \
            release-assets/mac/latest-mac-x64.yml \
            release-assets/mac/latest-mac.yml
          rm -f release-assets/mac/latest-mac-arm64.yml release-assets/mac/latest-mac-x64.yml

      - name: Download Windows release artifacts
        if: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: ade-win-release-${{ inputs.release_tag }}
          path: release-assets/win

      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: release-assets/runtime
          merge-multiple: true

      - name: Add standalone runtime installer
        run: |
          cp apps/ade-cli/scripts/install-runtime.sh release-assets/runtime/install.sh
          chmod 755 release-assets/runtime/install.sh

      # The published SHA256SUMS is generated later, over the exact merged set of
      # standalone assets this release uploads. Hashing release-assets/runtime on
      # its own would describe a set that is never published once the Windows
      # gate contributes the signed win32 standalone files.
      - name: Validate publish asset manifest
        run: |
          set -euo pipefail
          shopt -s nullglob

          require_file() {
            local file="$1"
            local label="${2:-$1}"
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty $label: $file"
              exit 1
            fi
          }

          require_glob() {
            local pattern="$1"
            local label="${2:-$1}"
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::Missing $label matching $pattern"
              exit 1
            fi
            for file in "${matches[@]}"; do
              require_file "$file" "$label"
            done
          }

          require_glob 'release-assets/mac/*.dmg' 'macOS DMG'
          require_glob 'release-assets/mac/*.zip' 'macOS zip'
          require_file 'release-assets/mac/latest-mac.yml' 'macOS auto-update metadata'

          require_file 'release-assets/runtime/install.sh' 'standalone runtime installer'
          if [ ! -x 'release-assets/runtime/install.sh' ]; then
            echo "::error::Standalone runtime installer is not executable."
            exit 1
          fi

          # Cross-platform runtime allowlist. Every ade-* file in the runtime
          # download must be one of the ten this release is allowed to carry, in
          # every flag state, so an extra or missing sidecar can never reach the
          # draft. All ten are produced by build-runtime-binaries in this run.
          runtime_files=(
            ade-darwin-arm64
            ade-darwin-arm64.native.tar.gz
            ade-darwin-x64
            ade-darwin-x64.native.tar.gz
            ade-linux-arm64
            ade-linux-arm64.native.tar.gz
            ade-linux-x64
            ade-linux-x64.native.tar.gz
            ade-win32-x64.exe
            ade-win32-x64.native.tar.gz
          )
          mapfile -t actual_runtime_files < <(
            find release-assets/runtime -maxdepth 1 -type f -name 'ade-*' -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t expected_runtime_files < <(printf '%s\n' "${runtime_files[@]}" | LC_ALL=C sort)
          if ! diff -u <(printf '%s\n' "${expected_runtime_files[@]}") <(printf '%s\n' "${actual_runtime_files[@]}"); then
            echo "::error::Runtime artifacts contain an unauthorized or missing entry."
            exit 1
          fi

          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            binary="release-assets/runtime/ade-$target"
            require_file "$binary" "ADE runtime binary for $target"
            require_file "release-assets/runtime/ade-$target.native.tar.gz" "ADE native dependency archive for $target"
            archive_listing="$RUNNER_TEMP/ade-$target-native-files.txt"
            tar -tzf "release-assets/runtime/ade-$target.native.tar.gz" > "$archive_listing"
            grep -q '^\./node_modules/' "$archive_listing" || {
              echo "::error::ADE native dependency archive for $target is missing node_modules."
              exit 1
            }
          done

      - name: Validate gated Windows publish asset manifest
        if: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Desktop installer set, built and signed by build-win-release in this
          # same run.
          installers=(release-assets/win/ADE-*-win-x64.exe)
          blockmaps=(release-assets/win/ADE-*-win-x64.exe.blockmap)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#blockmaps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed Windows installer and blockmap."
            exit 1
          fi
          test -s "${installers[0]}"
          test -s "${blockmaps[0]}"
          test -s release-assets/win/latest.yml

          # Updater feed correctness: latest.yml must name the installer that is
          # actually being published beside it, the same contract the merged
          # latest-mac.yml carries for macOS.
          installer_name="$(basename "${installers[0]}")"
          if ! grep -Fq "$installer_name" release-assets/win/latest.yml; then
            echo "::error::release-assets/win/latest.yml does not reference the published installer $installer_name."
            exit 1
          fi

          # Standalone Windows runtime, built and signed by build-runtime-binaries
          # in this same run.
          test -s release-assets/runtime/install.ps1
          test -s release-assets/runtime/ade-win32-x64.exe
          test -s release-assets/runtime/ade-win32-x64.native.tar.gz
          # Cross-check the Windows standalone bytes against the digests computed
          # on the signing runner, so a corrupted artifact transfer cannot reach
          # the draft. That manifest is written by Git Bash on windows-latest,
          # where sha256sum reads in binary mode and marks each name with a
          # leading '*'; normalize it before parsing. Text and binary mode are
          # identical here on Linux, so the normalized form verifies correctly.
          test -s release-assets/runtime/SHA256SUMS
          windows_sums="$RUNNER_TEMP/windows-standalone-SHA256SUMS"
          sed 's/^\([0-9a-f]\{64\}\) [ *]/\1  /' release-assets/runtime/SHA256SUMS > "$windows_sums"
          if grep -Ev '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' "$windows_sums"; then
            echo "::error::Windows standalone checksum manifest has an invalid entry."
            exit 1
          fi
          mapfile -t actual_checksum_files < <(awk '{ print $2 }' "$windows_sums" | LC_ALL=C sort)
          mapfile -t expected_checksum_files < <(
            printf '%s\n' install.ps1 ade-win32-x64.exe ade-win32-x64.native.tar.gz | LC_ALL=C sort
          )
          if ! diff -u <(printf '%s\n' "${expected_checksum_files[@]}") <(printf '%s\n' "${actual_checksum_files[@]}"); then
            echo "::error::Windows standalone checksum manifest does not name the exact authorized Windows runtime set."
            exit 1
          fi
          (cd release-assets/runtime && sha256sum -c "$windows_sums")

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
          TARGET_REF: ${{ inputs.target_ref }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Every asset comes from this run. The per-arch macOS zips +
          # latest-mac.yml are what electron-updater consumes; DMGs are the human
          # downloads. Mac blockmaps stay omitted. The Windows installer,
          # blockmap and latest.yml are the electron-updater equivalents.
          base_files=(
            release-assets/mac/*.dmg
            release-assets/mac/*.zip
            release-assets/mac/latest-mac.yml
          )
          # Cross-platform standalone runtime. These are notarized or signed by
          # the build-runtime-binaries jobs of this same run, which is what keeps
          # them byte-identical to the copies bundled inside the desktop
          # installers published beside them.
          runtime_files=(
            release-assets/runtime/install.sh
            release-assets/runtime/ade-darwin-*
            release-assets/runtime/ade-linux-*
          )
          files=("${base_files[@]}" "${runtime_files[@]}")
          checksum_files=("${runtime_files[@]}")

          # One switch decides whether this release carries Windows at all.
          if [ "$PUBLISH_WINDOWS" = "1" ]; then
            windows_files=(
              release-assets/win/ADE-*-win-x64.exe
              release-assets/win/ADE-*-win-x64.exe.blockmap
              release-assets/win/latest.yml
              release-assets/runtime/install.ps1
              release-assets/runtime/ade-win32-x64.exe
              release-assets/runtime/ade-win32-x64.native.tar.gz
            )
            files=("${files[@]}" "${windows_files[@]}")
            checksum_files+=(
              release-assets/runtime/install.ps1
              release-assets/runtime/ade-win32-x64.exe
              release-assets/runtime/ade-win32-x64.native.tar.gz
            )
          fi

          # One checksum manifest over exactly the standalone assets uploaded
          # below, regenerated so the digests always describe the bytes actually
          # published rather than any per-job manifest staged upstream.
          # install-runtime.sh and install-runtime.ps1 resolve their own
          # platform's entries from this file.
          mkdir -p release-assets/publish
          published_checksums=release-assets/publish/SHA256SUMS
          for checksum_file in "${checksum_files[@]}"; do
            printf '%s  %s\n' \
              "$(sha256sum "$checksum_file" | cut -d ' ' -f 1)" \
              "$(basename "$checksum_file")"
          done | LC_ALL=C sort -k2 > "$published_checksums"
          if grep -Ev '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' "$published_checksums"; then
            echo "::error::Published checksum manifest has an invalid entry."
            exit 1
          fi
          mapfile -t expected_published_checksums < <(
            for checksum_file in "${checksum_files[@]}"; do basename "$checksum_file"; done | LC_ALL=C sort
          )
          mapfile -t actual_published_checksums < <(awk '{ print $2 }' "$published_checksums")
          if ! diff -u \
            <(printf '%s\n' "${expected_published_checksums[@]}") \
            <(printf '%s\n' "${actual_published_checksums[@]}"); then
            echo "::error::Published checksum manifest does not name the exact published standalone asset set."
            exit 1
          fi
          files+=("$published_checksums")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts were found after validation."
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG_NAME is already public. Refusing to overwrite published assets."
              exit 1
            fi
            approved_target="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
            release_tag_target="$(gh api "repos/$GH_REPO/commits/$TAG_NAME" --jq '.sha' | tr '[:upper:]' '[:lower:]')"
            if [ "$release_tag_target" != "$approved_target" ]; then
              echo "::error::Existing draft tag $TAG_NAME resolves to $release_tag_target, not approved target $approved_target."
              exit 1
            fi
            mapfile -t existing_assets < <(
              gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name'
            )
            for asset in "${existing_assets[@]}"; do
              gh release delete-asset "$TAG_NAME" "$asset" --repo "$GH_REPO" --yes
            done
            gh release upload "$TAG_NAME" "${files[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --repo "$GH_REPO" \
              --draft \
              --title "$TAG_NAME" \
              --generate-notes \
              --target "$TARGET_REF"
          fi

          approved_target="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          final_tag_target="$(gh api "repos/$GH_REPO/commits/$TAG_NAME" --jq '.sha' | tr '[:upper:]' '[:lower:]')"
          if [ "$final_tag_target" != "$approved_target" ]; then
            echo "::error::Draft release tag $TAG_NAME resolves to $final_tag_target, not approved target $approved_target."
            exit 1
          fi
          mapfile -t expected_assets < <(
            for file in "${files[@]}"; do basename "$file"; done | LC_ALL=C sort
          )
          mapfile -t actual_assets < <(
            gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort
          )
          if ! diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${actual_assets[@]}"); then
            echo "::error::Draft release asset inventory differs from the exact validated set."
            exit 1
          fi
