name: Release core

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to stamp into the desktop app version.
        required: true
        type: string
      target_ref:
        description: Commit SHA or ref to build and release.
        required: true
        type: string
      windows_proof:
        description: >-
          Collect clean-host Windows proof evidence. Builds Windows even while
          ADE_WINDOWS_PUBLIC_RELEASE_ENABLED is off and emits the exact-SHA
          proof manifest bundle. Deliberate evidence collection only; it does
          not gate ordinary releases.
        required: false
        default: false
        type: boolean
    outputs:
      runtime_result:
        description: Aggregate result of the build-runtime-binaries matrix.
        value: ${{ jobs.build-results.outputs.runtime_result }}
      mac_result:
        description: Aggregate result of the build-mac-release matrix.
        value: ${{ jobs.build-results.outputs.mac_result }}
      windows_result:
        description: >-
          Result of build-win-release. 'skipped' when the Windows publication
          gate is off and no proof run was requested.
        value: ${{ jobs.build-results.outputs.windows_result }}

# No job in this workflow may request more than these permissions. It is called
# by prepare-release.yml with a read-only token, and GitHub rejects a called
# workflow at parse time if any nested job requests more than the caller grants,
# regardless of whether that job would ever run. Publishing lives in
# release-publish.yml for exactly this reason.
permissions:
  actions: read
  checks: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Validate release tag and target binding
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag must use the canonical v1.2.3 or v1.2.3-prerelease form."
            exit 1
          fi

          target_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG" | tr '[:upper:]' '[:lower:]')"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "::error::Release tag $RELEASE_TAG resolves to $tag_sha, not approved target $target_sha."
              exit 1
            fi
          fi

      # Skipped only for windows_proof, which exists to collect clean-host
      # evidence for a commit that has NOT merged yet -- proving the packaging
      # and signing of a change is the whole point, and requiring main first
      # would make that impossible. That mode is reachable only from
      # prepare-release.yml, which holds contents: read and cannot publish, so
      # nothing can ship from a commit this step did not vet. Every publishing
      # path leaves windows_proof false and is still gated here.
      - name: Ensure release commit points to main
        if: ${{ !inputs.windows_proof }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      # Skipped for windows_proof only, alongside the main-ancestor check above
      # and for the same reason: that mode exists to package and sign a commit
      # that has not merged, and it runs solely from prepare-release.yml, which
      # holds contents: read and cannot create a release or tag. Nothing can
      # ship from a commit this step did not vet. Every publishing path leaves
      # windows_proof false and is still gated here.
      - name: Ensure CI passed for release commit
        if: ${{ !inputs.windows_proof }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: scripts/require-release-ci-pass.sh "$TARGET_REF"

      # Windows builds fresh on the tag, the same way macOS does. There is one
      # maintainer-facing switch, ADE_WINDOWS_PUBLIC_RELEASE_ENABLED, plus the
      # deliberate windows_proof dispatch input for clean-host evidence runs.
      # Fail here, a minute in, rather than after a full Windows package build.
      - name: Validate Windows release configuration
        env:
          PUBLISH_WINDOWS: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED }}
          WINDOWS_PROOF: ${{ inputs.windows_proof }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH_WINDOWS" != "1" ] && [ "$WINDOWS_PROOF" != "true" ]; then
            echo "Windows release is disabled for this run. Set ADE_WINDOWS_PUBLIC_RELEASE_ENABLED=1 to publish Windows assets."
            exit 0
          fi

          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ]; then
            echo "::error::Windows releases require the AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET secrets."
            exit 1
          fi
          if [ -z "$WINDOWS_SIGNING_EXPECTED_SUBJECT" ]; then
            echo "::error::Windows releases require the WINDOWS_SIGNING_EXPECTED_SUBJECT secret to pin the approved publisher."
            exit 1
          fi
          # Azure Artifact Signing renews the certificate daily and expires it
          # after 72 hours, so a thumbprint pin would start failing releases
          # within days. Refuse the secret rather than ignore it.
          if [ -n "$WINDOWS_SIGNING_EXPECTED_THUMBPRINT" ]; then
            echo "::error::WINDOWS_SIGNING_EXPECTED_THUMBPRINT is not supported by the Azure Artifact Signing pipeline. Delete the secret and pin WINDOWS_SIGNING_EXPECTED_SUBJECT instead."
            exit 1
          fi

  build-mac-release:
    # Unlike build-win-release, this job does not start early and wait for its
    # runtime artifact: macOS runners have a small account-wide concurrency
    # limit, and a job holding one while it waits starved the macOS runtime
    # builds it was waiting for (dry run on 2026-10-12 lost 8 minutes to it).
    needs:
      - verify
      - build-runtime-binaries
    # One job per arch, in parallel, both on Apple Silicon. Each job signs,
    # notarizes and staples its own app; the per-arch updater manifests are
    # merged by the publish-release job in release-publish.yml.
    #
    # x64 is packaged on Apple Silicon with the native arm64 Node: install-cross-arch-packages.mjs adds the darwin-x64 npm packages
    # next to the arm64 ones, electron-builder packages Electron x64, and
    # validate-mac-artifacts rejects any Mach-O without x64 code or an x64 twin.
    # The Intel runner took 35-45 minutes for this job; an x64 Node under
    # Rosetta took longer still (measured 2026-10-12). The one check that needs
    # a real x64 machine, running the packaged app, is smoke-mac-x64 below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x64
    runs-on: macos-15
    concurrency:
      group: release-${{ inputs.release_tag }}-mac-${{ matrix.arch }}
      cancel-in-progress: true
    # Job-scoped so every packaging step -- materialize, the pre-build gate, and
    # the validators inside dist:mac:*:signed -- agrees on the single runtime
    # target this job may bundle.
    env:
      ADE_RUNTIME_TARGET: darwin-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Restore-only: a cache saved on a release tag is invisible to the next
      # release, so saving here only filled the repo's 10 GB cache limit. main's
      # CI saves npm-dl-v1 entries per OS and arch; any of them seeds npm ci.
      # Ask npm where its cache is: hosted Windows runners move it to
      # C:\npm\cache, so a hard-coded path silently caches nothing.
      - name: Locate npm download cache
        id: npm_cache_dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm_cache_dir.outputs.dir }}
          key: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ade-cli/package-lock.json') }}
          restore-keys: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Add darwin-x64 npm platform packages
        if: ${{ matrix.arch == 'x64' }}
        run: cd apps/desktop && node scripts/install-cross-arch-packages.mjs --cpu=x64

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      # The transcribe.cpp binary and the five Swift helpers are universal and
      # depend only on their own sources, yet compiling them took 16 minutes of
      # every release. warm-release-caches.yml builds them on main; a release
      # restores them here and builds from source only on a miss.
      - name: Resolve release cache keys
        id: cache-keys
        uses: ./.github/actions/release-cache-keys

      - name: Restore transcribe-cli
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop/resources/whisper/transcribe-cli
          key: ${{ steps.cache-keys.outputs.transcribe-darwin }}

      - name: Restore native helpers
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-keys.outputs.native-helper-paths }}
          key: ${{ steps.cache-keys.outputs.native-helpers }}

      - name: Verify cached native builds
        env:
          GH_TOKEN: ${{ github.token }}
          HELPER_PATHS: ${{ steps.cache-keys.outputs.native-helper-paths }}
        run: |
          scripts/verify-cached-release-builds.sh - apps/desktop/resources/whisper/transcribe-cli
          # One path per line, none with spaces; split them into arguments.
          # shellcheck disable=SC2086
          scripts/verify-cached-release-builds.sh ADE_NATIVE_HELPERS_CACHED $HELPER_PATHS

      # Only this job's own target. Downloading every ade-runtime-* artifact is
      # what let foreign-platform payloads into the bundle in the first place.
      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: ade-runtime-darwin-${{ matrix.arch }}
          path: apps/desktop/resources/runtime

      - name: Materialize ADE runtime resources
        env:
          ADE_RUNTIME_ARTIFACTS_DIR: ${{ github.workspace }}/apps/desktop/resources/runtime
        run: cd apps/desktop && npm run materialize:runtime-resources

      # Seconds, not minutes: fail here rather than after a ~20 minute build if
      # resources/runtime holds anything but this job's target.
      - name: Gate runtime resources to darwin-${{ matrix.arch }}
        run: cd apps/desktop && npm run assert:runtime-target

      - name: Stamp release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd apps/desktop && npm run version:release

      - name: Reset release output
        run: |
          rm -rf apps/desktop/release apps/desktop/.cache
          mkdir -p apps/desktop/.cache

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error::Missing APPLE_API_KEY_P8 or APPLE_API_KEY_ID GitHub secret."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Materialize Developer ID provisioning profile
        env:
          MACOS_DEVELOPER_ID_PROFILE_B64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_B64 }}
        run: |
          if [ -z "$MACOS_DEVELOPER_ID_PROFILE_B64" ]; then
            echo "::error::Missing MACOS_DEVELOPER_ID_PROFILE_B64 GitHub secret."
            exit 1
          fi

          PROFILE_PATH="$GITHUB_WORKSPACE/apps/desktop/build/ade-desktop.provisionprofile"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > /dev/null

      - name: Reject insecure macOS signing certificate URL
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          fi

      - name: Import app Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing CSC_LINK or CSC_KEY_PASSWORD GitHub secret."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/app-signing.p12"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          elif [[ "$CSC_LINK" == https://* ]]; then
            curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
          elif [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          fi

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # electron-builder downloads Electron once and fails the build on a network
      # error. Fetch it into the cache it reads, with retries, first.
      - name: Prefetch Electron for ${{ matrix.arch }}
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron
        run: cd apps/desktop && node scripts/prefetch-electron.mjs --platform=darwin --arch=${{ matrix.arch }}

      - name: Build signed ${{ matrix.arch }} macOS release
        env:
          # These archives were signed and notarized by their native
          # build-runtime-binaries matrix jobs. Verify them here instead of
          # re-signing and re-timestamping foreign-arch payloads.
          ADE_RUNTIME_ARCHIVES_PRE_SIGNED: "1"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          # Emits source maps and lets electron-builder's beforePack hook
          # (apps/desktop/scripts/sentry-before-pack.cjs) stamp Sentry debug IDs
          # into the bundles. The maps themselves never ship (!dist/**/*.map).
          ADE_BUILD_SOURCEMAPS: "1"
          ELECTRON_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron-builder
        run: cd apps/desktop && npm run dist:mac:${{ matrix.arch }}:signed

      # The DMG is not notarized separately: the app inside it is notarized
      # and stapled, and that is what Gatekeeper checks when ADE is opened.
      # electron-builder does not notarize DMGs by default either, and this
      # step cost 4-7 minutes per job.
      - name: Validate ${{ matrix.arch }} release artifacts
        run: cd apps/desktop && npm run validate:mac:artifacts

      # Artifact size is unknowable before the build, so this is its own step
      # rather than a preflight. An oversized zip crashes every updating macOS
      # client, so it must never reach the upload below.
      - name: Enforce macOS update artifact size budget
        run: cd apps/desktop && npm run assert:artifact-size

      - name: Rename per-arch updater manifest
        run: cd apps/desktop && mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-mac-release-${{ inputs.release_tag }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

      # Readable stack traces for this build in Sentry (ade-desktop and
      # ade-brain). After the artifact upload, so it can never hold up or
      # change a release; the script skips without SENTRY_AUTH_TOKEN and never
      # exits non-zero. Release ade@<tag without v> is the version stamped
      # above, which is what the app and the brain report.
      - name: Upload ${{ matrix.arch }} source maps to Sentry
        if: ${{ !inputs.windows_proof }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/sentry/sentry-release.mjs upload --version "$RELEASE_TAG" --dist "mac-${{ matrix.arch }}"

  build-win-release:
    # Same shape as build-mac-release: the tagged commit is built, signed and
    # validated in-run, and its output is published by release-publish.yml. The
    # windows_proof input additionally builds Windows while the publication gate
    # is still off, so clean-host evidence can be collected deliberately.
    if: ${{ vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' || inputs.windows_proof }}
    # Waits for its own runtime artifact instead; see build-mac-release.
    needs:
      - verify
    runs-on: windows-latest
    concurrency:
      group: release-${{ inputs.release_tag }}-win-x64
      cancel-in-progress: true
    # Same job-scoped pin as build-mac-release: the Windows bundle may carry the
    # win32-x64 runtime and nothing else.
    env:
      ADE_RUNTIME_TARGET: win32-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Restore-only: a cache saved on a release tag is invisible to the next
      # release, so saving here only filled the repo's 10 GB cache limit. main's
      # CI saves npm-dl-v1 entries per OS and arch; any of them seeds npm ci.
      # Ask npm where its cache is: hosted Windows runners move it to
      # C:\npm\cache, so a hard-coded path silently caches nothing.
      - name: Locate npm download cache
        id: npm_cache_dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm_cache_dir.outputs.dir }}
          key: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ade-cli/package-lock.json') }}
          restore-keys: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Require Windows Authenticode signing secrets
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) -or [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET)) {
            throw "Public Windows releases require AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_EXPECTED_SUBJECT)) {
            throw "Public Windows releases require WINDOWS_SIGNING_EXPECTED_SUBJECT."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_EXPECTED_THUMBPRINT)) {
            throw "WINDOWS_SIGNING_EXPECTED_THUMBPRINT is not supported by the Azure Artifact Signing pipeline; pin WINDOWS_SIGNING_EXPECTED_SUBJECT instead."
          }

      # See the equivalent step in build-mac-release.
      - name: Resolve release cache keys
        id: cache-keys
        uses: ./.github/actions/release-cache-keys

      - name: Restore transcribe-cli
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop/resources/whisper/transcribe-cli.exe
          key: ${{ steps.cache-keys.outputs.transcribe-win32 }}

      - name: Verify cached transcribe-cli
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-cached-release-builds.sh - apps/desktop/resources/whisper/transcribe-cli.exe

      - name: Wait for the win32-x64 runtime binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-for-run-artifact.sh ade-runtime-win32-x64 "build-runtime-binaries (win32-x64,"

      # Only this job's own target; see the equivalent step in build-mac-release.
      - name: Download ADE runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: ade-runtime-win32-x64
          path: apps/desktop/resources/runtime

      - name: Materialize ADE runtime resources
        env:
          ADE_RUNTIME_ARTIFACTS_DIR: ${{ github.workspace }}\apps\desktop\resources\runtime
        run: cd apps/desktop && npm run materialize:runtime-resources

      - name: Gate runtime resources to win32-x64
        run: cd apps/desktop && npm run assert:runtime-target

      # Clean-host evidence still covers every published standalone runtime, so
      # the full artifact set is staged OUTSIDE resources/runtime, where it
      # cannot reach the desktop bundle.
      - name: Wait for every runtime binary for proof
        if: ${{ inputs.windows_proof }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One deadline for all five, not a fresh 40 minutes per artifact.
          deadline=$(( $(date +%s) + 2400 ))
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            remaining=$(( deadline - $(date +%s) ))
            [ "$remaining" -gt 0 ] || { echo "::error::Timed out waiting for the runtime binaries."; exit 1; }
            WAIT_TIMEOUT_SECONDS="$remaining" scripts/wait-for-run-artifact.sh "ade-runtime-$target" "build-runtime-binaries ($target,"
          done

      - name: Download all standalone runtime artifacts for proof
        if: ${{ inputs.windows_proof }}
        uses: actions/download-artifact@v4
        with:
          pattern: ade-runtime-*
          path: ${{ runner.temp }}/ade-runtime-all
          merge-multiple: true

      - name: Stamp release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd apps/desktop && npm run version:release

      - name: Reset release output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force apps/desktop/release, apps/desktop/.cache -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path apps/desktop/.cache | Out-Null

      - name: Prefetch Electron for Windows
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron
        run: cd apps/desktop && node scripts/prefetch-electron.mjs --platform=win32 --arch=x64

      - name: Build and validate Windows release
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\apps\desktop\.cache\electron-builder
          ADE_RELEASE_REPOSITORY: ${{ github.repository }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          # Azure Artifact Signing service principal. EnvironmentCredential
          # reads exactly these three names and is tried ahead of the managed
          # identity probe that a GitHub-hosted runner cannot answer.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          # See the equivalent step in build-mac-release.
          ADE_BUILD_SOURCEMAPS: "1"
        run: cd apps/desktop && npm run dist:win:signed

      # Windows parity with the macOS budget gate. Runs before the smoke test and
      # the upload so an oversized installer cannot reach a release draft.
      - name: Enforce Windows installer size budget
        run: cd apps/desktop && npm run assert:artifact-size

      - name: Test installed signed Windows product lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "apps/desktop/release/ADE-[0-9]*-win-x64.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one signed Windows installer, found $($installers.Count)." }
          # Proof runs also install ten times in a row, counting installer
          # crashes without retrying, to measure the installer's crash rate.
          $repeat = if ("${{ inputs.windows_proof }}" -eq "true") { 10 } else { 0 }
          & apps/desktop/scripts/windows-installed-product-smoke.ps1 -InstallerPath $installers[0].FullName -FreshInstallRepeat $repeat

      - name: Upload validated Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-win-release-${{ inputs.release_tag }}
          path: |
            apps/desktop/release/ADE-*-win-x64.exe
            apps/desktop/release/ADE-*-win-x64.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

      # See the equivalent step in build-mac-release. Proof runs build commits
      # that may never ship, so they upload nothing.
      - name: Upload Windows source maps to Sentry
        if: ${{ !inputs.windows_proof }}
        continue-on-error: true
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/sentry/sentry-release.mjs upload --version "$env:RELEASE_TAG" --dist win-x64

      # Everything below is deliberate clean-host evidence collection. It builds
      # the redacted proof bundle and its exact-SHA manifest, and never gates an
      # ordinary release. The machine-checkable Windows gates all ran above:
      # the job-level signing-secret requirement, --require-signing in
      # run-electron-builder.mjs, --require-signed Authenticode verification in
      # validate-win-artifacts.mjs, and the installed-product lifecycle smoke.
      - name: Stage standalone runtime proof assets
        if: ${{ inputs.windows_proof }}
        shell: pwsh
        env:
          ADE_RUNTIME_PROOF_DIR: ${{ runner.temp }}/ade-runtime-all
        run: |
          $releaseDir = "apps/desktop/release"
          $runtimeSourceDir = $env:ADE_RUNTIME_PROOF_DIR
          Copy-Item -LiteralPath "apps/ade-cli/scripts/install-runtime.sh" -Destination "$releaseDir/install.sh"
          Copy-Item -LiteralPath "apps/ade-cli/scripts/install-runtime.ps1" -Destination "$releaseDir/install.ps1"
          $runtimeFiles = @(
            "ade-darwin-arm64",
            "ade-darwin-arm64.native.tar.gz",
            "ade-darwin-x64",
            "ade-darwin-x64.native.tar.gz",
            "ade-linux-arm64",
            "ade-linux-arm64.native.tar.gz",
            "ade-linux-x64",
            "ade-linux-x64.native.tar.gz",
            "ade-win32-x64.exe",
            "ade-win32-x64.native.tar.gz"
          )
          $actualRuntimeFiles = @(
            Get-ChildItem -LiteralPath $runtimeSourceDir -File -Filter "ade-*" |
              ForEach-Object Name |
              Sort-Object
          )
          $unexpectedRuntimeFiles = @($actualRuntimeFiles | Where-Object { $_ -notin $runtimeFiles })
          $missingRuntimeFiles = @($runtimeFiles | Where-Object { $_ -notin $actualRuntimeFiles })
          if ($unexpectedRuntimeFiles.Count -gt 0 -or $missingRuntimeFiles.Count -gt 0) {
            throw "Runtime artifact inventory mismatch. Missing: $($missingRuntimeFiles -join ', '); unexpected: $($unexpectedRuntimeFiles -join ', ')."
          }
          foreach ($runtimeFile in $runtimeFiles) {
            Copy-Item -LiteralPath (Join-Path $runtimeSourceDir $runtimeFile) -Destination $releaseDir
          }
          $checksumFiles = @(
            Get-Item -LiteralPath "$releaseDir/install.sh"
            Get-Item -LiteralPath "$releaseDir/install.ps1"
            $runtimeFiles | ForEach-Object { Get-Item -LiteralPath "$releaseDir/$_" }
          ) | Sort-Object Name
          $checksumLines = $checksumFiles | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path $releaseDir) "SHA256SUMS"),
            $checksumLines,
           [System.Text.UTF8Encoding]::new($false)
          )

      - name: Generate exact-SHA Windows proof manifest
        if: ${{ inputs.windows_proof }}
        shell: pwsh
        run: >-
          node apps/desktop/scripts/windows-proof-manifest.mjs create
          --output apps/desktop/release/windows-proof-manifest.json
          --release-dir apps/desktop/release
          --target-sha "${{ inputs.target_ref }}"
          --release-tag "${{ inputs.release_tag }}"
          --repository "${{ github.repository }}"
          --workflow-name "${{ github.workflow }}"
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --workflow-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Validate exact-SHA Windows build proof
        if: ${{ inputs.windows_proof }}
        shell: pwsh
        run: >-
          node apps/desktop/scripts/windows-proof-manifest.mjs validate
          --manifest apps/desktop/release/windows-proof-manifest.json
          --phase build
          --expected-sha "${{ inputs.target_ref }}"
          --expected-tag "${{ inputs.release_tag }}"
          --expected-run-id "${{ github.run_id }}"
          --artifact-root apps/desktop/release

      - name: Upload validated Windows proof bundle
        if: ${{ inputs.windows_proof }}
        uses: actions/upload-artifact@v4
        with:
          name: ade-win-proof-${{ inputs.release_tag }}
          # Clean-host evidence is reviewed by a human days or weeks after the
          # run. Pinned instead of inherited so a lowered repository or
          # organization default cannot expire the bundle mid-review.
          # Keep this in sync with docs/playbooks/windows-signed-release.md.
          retention-days: 90
          path: |
            apps/desktop/release/ADE-*-win-x64.exe
            apps/desktop/release/ADE-*-win-x64.exe.blockmap
            apps/desktop/release/ade-darwin-arm64
            apps/desktop/release/ade-darwin-arm64.native.tar.gz
            apps/desktop/release/ade-darwin-x64
            apps/desktop/release/ade-darwin-x64.native.tar.gz
            apps/desktop/release/ade-linux-arm64
            apps/desktop/release/ade-linux-arm64.native.tar.gz
            apps/desktop/release/ade-linux-x64
            apps/desktop/release/ade-linux-x64.native.tar.gz
            apps/desktop/release/ade-win32-x64.exe
            apps/desktop/release/ade-win32-x64.native.tar.gz
            apps/desktop/release/install.sh
            apps/desktop/release/install.ps1
            apps/desktop/release/SHA256SUMS
            apps/desktop/release/latest.yml
            apps/desktop/release/windows-proof-manifest.json
          if-no-files-found: error

  build-runtime-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            binary: ade-darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: ade-darwin-x64
          - target: linux-x64
            os: ubuntu-latest
            binary: ade-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: ade-linux-arm64
          - target: win32-x64
            os: windows-latest
            binary: ade-win32-x64.exe
    runs-on: ${{ matrix.os }}
    concurrency:
      group: release-${{ inputs.release_tag }}-runtime-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Linux lane-screen helper (Rust, static musl) ships inside the
      # runtime's native archive. It builds in the background while npm
      # installs, so it adds nothing to these jobs' wall time (and they are
      # minutes off the release's critical path, which runs through darwin-x64
      # and the Mac build). Pure Rust: no musl-tools needed.
      - name: Restore Linux desktop driver cargo cache
        if: ${{ startsWith(matrix.target, 'linux-') }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: linux-desktop-driver-cargo-v1-${{ runner.arch }}-${{ hashFiles('apps/desktop/native/ADEDesktopDriverLinux/Cargo.lock') }}
          restore-keys: linux-desktop-driver-cargo-v1-${{ runner.arch }}-
      - name: Start Linux desktop driver build
        if: ${{ startsWith(matrix.target, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          rust_target=$([ "${{ matrix.target }}" = "linux-arm64" ] && echo aarch64-unknown-linux-musl || echo x86_64-unknown-linux-musl)
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add "$rust_target"
          log="$RUNNER_TEMP/linux-desktop-driver.log"
          # Detached so it outlives this step; "Finish" below waits for it.
          # shellcheck disable=SC2016 # $1/$2 expand in the child shell.
          setsid nohup bash -c 'node apps/desktop/scripts/build-linux-desktop-driver.mjs --target "$1" > "$2" 2>&1; echo $? > "$2.exit"' _ "${{ matrix.target }}" "$log" > /dev/null 2>&1 &
          echo "ADE_REQUIRE_LINUX_DESKTOP_DRIVER=1" >> "$GITHUB_ENV"

      # Restore-only: a cache saved on a release tag is invisible to the next
      # release, so saving here only filled the repo's 10 GB cache limit. main's
      # CI saves npm-dl-v1 entries per OS and arch; any of them seeds npm ci.
      # Ask npm where its cache is: hosted Windows runners move it to
      # C:\npm\cache, so a hard-coded path silently caches nothing.
      - name: Locate npm download cache
        id: npm_cache_dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm_cache_dir.outputs.dir }}
          key: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ade-cli/package-lock.json') }}
          restore-keys: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        if: runner.os == 'macOS'
        run: echo "PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install ADE CLI dependencies
        run: cd apps/ade-cli && npm ci

      - name: Stamp runtime release version
        env:
          ADE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node apps/desktop/scripts/set-release-version.mjs

      - name: Finish Linux desktop driver build
        if: ${{ startsWith(matrix.target, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/linux-desktop-driver.log"
          for _ in $(seq 1 600); do [ -f "$log.exit" ] && break; sleep 1; done
          cat "$log"
          [ "$(cat "$log.exit" 2>/dev/null)" = "0" ]
          # The helper answers `ping` with no X server, so a broken binary
          # fails here rather than on a user's box.
          # Input held open a moment: the helper exits when its stdin closes.
          reply=$( (printf '{"id":"1","op":"ping"}\n'; sleep 3) \
            | timeout 20 apps/desktop/resources/native/${{ matrix.target }}/ade-desktop-driver host --ade-home "$RUNNER_TEMP/ade-home")
          echo "$reply"
          grep -q '"linux"' <<< "$reply"

      - name: Build ADE runtime binary
        env:
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          # Stamps a Sentry debug ID into the bundle and writes the SEA entry's
          # source map (build-static.mjs); uploaded after the artifact below.
          ADE_BUILD_SOURCEMAPS: "1"
        run: cd apps/ade-cli && npm run build:static -- --target ${{ matrix.target }}

      - name: Sign and validate standalone Windows runtime
        if: ${{ matrix.target == 'win32-x64' && (vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' || inputs.windows_proof) }}
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        run: |
          & apps/ade-cli/scripts/sign-windows-runtime.ps1 `
            -BinaryPath "apps/ade-cli/dist-static/${{ matrix.binary }}"

      - name: Materialize runtime notarization API key
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error::Missing APPLE_API_KEY_P8 or APPLE_API_KEY_ID GitHub secret."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import runtime Developer ID certificate
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing CSC_LINK or CSC_KEY_PASSWORD GitHub secret."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/runtime-signing.p12"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$CERT_PATH"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$CERT_PATH"
          elif [[ "$CSC_LINK" == https://* ]]; then
            curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
          elif [[ "$CSC_LINK" == http://* ]]; then
            echo "::error::CSC_LINK must use HTTPS, a local path, or an encoded certificate payload."
            exit 1
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          fi

          KEYCHAIN="$RUNNER_TEMP/runtime-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Sign and notarize ADE runtime binary
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cd apps/ade-cli && npm run notarize:static -- --binary=dist-static/ade-${{ matrix.target }}

      - name: Smoke test ADE runtime binary
        shell: bash
        run: |
          apps/ade-cli/dist-static/${{ matrix.binary }} --version
          archive="apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz"
          archive_listing="$RUNNER_TEMP/ade-${{ matrix.target }}-native-files.txt"
          tar -tzf "$archive" > "$archive_listing"
          grep -q '^\./node_modules/' "$archive_listing"
          # Derived from the canonical runtime-fetched package list rather than
          # hardcoded: this gate used to name only opencode, leaving the other
          # 25 packages -- every Codex and Claude agent SDK native -- unguarded.
          leak_pattern="$(node apps/desktop/scripts/runtime-fetched-tool-packages.mjs --grep-pattern)"
          if grep -Eq "$leak_pattern" "$archive_listing"; then
            echo "Unexpected runtime-fetched tool package in native runtime archive:"
            # Bounded sample: one leaked platform package is tens of thousands of
            # entries, and the first few name it just as well as all of them.
            grep -E "$leak_pattern" "$archive_listing" | head -20 || true
            exit 1
          fi
          node apps/ade-cli/scripts/probe-runtime-crsqlite.mjs --archive "$archive" --target "${{ matrix.target }}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            grep -q '^\./native/ade-desktop-driver$' "$archive_listing"
          fi

      - name: Assemble signed Windows standalone runtime bundle
        if: ${{ matrix.target == 'win32-x64' && (vars.ADE_WINDOWS_PUBLIC_RELEASE_ENABLED == '1' || inputs.windows_proof) }}
        shell: bash
        run: |
          set -euo pipefail
          cp apps/ade-cli/scripts/install-runtime.ps1 apps/ade-cli/dist-static/install.ps1
          (
            cd apps/ade-cli/dist-static
            sha256sum install.ps1 ade-win32-x64.exe ade-win32-x64.native.tar.gz \
              | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload ADE runtime binary
        uses: actions/upload-artifact@v4
        with:
          name: ade-runtime-${{ matrix.target }}
          path: |
            apps/ade-cli/dist-static/${{ matrix.binary }}
            apps/ade-cli/dist-static/ade-${{ matrix.target }}.native.tar.gz
            apps/ade-cli/dist-static/install.ps1
            apps/ade-cli/dist-static/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      # Readable stack traces in Sentry (ade-brain) for the standalone runtime,
      # which is the brain on Linux. Same rules as the desktop uploads: after
      # the artifact, never fails the job, skips without SENTRY_AUTH_TOKEN.
      # The dist is what the runtime reports (sentryDist: mac-*, win-*, linux-*).
      - name: Upload runtime source maps to Sentry
        if: ${{ !inputs.windows_proof }}
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          target="${{ matrix.target }}"; dist="${target/darwin/mac}"; dist="${dist/win32/win}"
          node scripts/sentry/sentry-release.mjs upload --version "$RELEASE_TAG" --dist "$dist" \
            --dir "apps/ade-cli/dist-static/.sea/$target/sentry"

  smoke-mac-x64:
    # build-mac-release packages x64 on Apple Silicon, where running the x64 app
    # under Rosetta is unreliable, so its validator skips the packaged-app
    # smoke. This job reruns the full validator on a real x64 Mac against the
    # exact zip that will be published. It installs only what the validator
    # imports, so it adds a few minutes after the x64 build. It starts after
    # that build rather than waiting on a macOS runner; see build-mac-release.
    needs: build-mac-release
    runs-on: macos-15-intel
    env:
      ADE_RUNTIME_TARGET: darwin-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Restore-only: a cache saved on a release tag is invisible to the next
      # release, so saving here only filled the repo's 10 GB cache limit. main's
      # CI saves npm-dl-v1 entries per OS and arch; any of them seeds npm ci.
      # Ask npm where its cache is: hosted Windows runners move it to
      # C:\npm\cache, so a hard-coded path silently caches nothing.
      - name: Locate npm download cache
        id: npm_cache_dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm_cache_dir.outputs.dir }}
          key: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ade-cli/package-lock.json') }}
          restore-keys: npm-dl-v1-${{ runner.os }}-${{ runner.arch }}-

      # The packaged-app smoke imports its SDKs with ESM import(), which
      # ignores the app's NODE_PATH, so it resolves their dependencies from the
      # node_modules above the app, as it always has in the build jobs. The
      # production tree is enough for that and installs in a fraction of a full
      # npm ci. The validator's one dev dependency, @electron/asar, goes one
      # directory up, where Node still finds it.
      - name: Install validator and smoke dependencies
        run: |
          set -euo pipefail
          cd apps/desktop
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          asar="$(node -p 'require("./package-lock.json").packages["node_modules/@electron/asar"].version')"
          npm install --prefix "$GITHUB_WORKSPACE/apps" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts "@electron/asar@$asar"

      # The validator compares the bundled ADE CLI against the CLI built from
      # this commit, so build it the same way the release job does.
      - name: Build the ADE CLI
        run: |
          cd apps/ade-cli && npm ci
          cd ../desktop && npm run ade:build

      - name: Download x64 release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ade-mac-release-${{ inputs.release_tag }}-x64
          path: apps/desktop/release

      - name: Unpack the x64 app from its updater zip
        run: |
          set -euo pipefail
          cd apps/desktop/release
          zips=(ADE-*-x64.zip)
          ditto -x -k "${zips[0]}" mac
          mv latest-mac-x64.yml latest-mac.yml

      - name: Validate x64 release on x64 hardware
        run: cd apps/desktop && node scripts/validate-mac-artifacts.mjs --skip-dmg

  build-results:
    # This workflow deliberately holds no job that can write to the repository,
    # so the publish gate cannot be evaluated here (see release-publish.yml).
    # Republish the three build results the gate reads as workflow outputs.
    # always() so a failed or skipped build is still reported rather than
    # collapsing the outputs to empty, which is what lets the caller keep the
    # original semantics: with the Windows gate on, a failed or skipped Windows
    # build blocks the draft exactly as a failed macOS build does.
    if: always()
    needs:
      - build-runtime-binaries
      - build-mac-release
      - smoke-mac-x64
      - build-win-release
    runs-on: ubuntu-latest
    outputs:
      runtime_result: ${{ needs.build-runtime-binaries.result }}
      # The macOS build counts only when the x64 smoke on x64 hardware passed.
      mac_result: ${{ needs.build-mac-release.result != 'success' && needs.build-mac-release.result || needs.smoke-mac-x64.result }}
      windows_result: ${{ needs.build-win-release.result }}
    steps:
      - name: Report build results
        env:
          RUNTIME_RESULT: ${{ needs.build-runtime-binaries.result }}
          MAC_RESULT: ${{ needs.build-mac-release.result }}
          SMOKE_RESULT: ${{ needs.smoke-mac-x64.result }}
          WINDOWS_RESULT: ${{ needs.build-win-release.result }}
        run: |
          echo "build-runtime-binaries: $RUNTIME_RESULT"
          echo "build-mac-release: $MAC_RESULT"
          echo "smoke-mac-x64: $SMOKE_RESULT"
          echo "build-win-release: $WINDOWS_RESULT"
