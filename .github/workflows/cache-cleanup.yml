name: Cache cleanup

# Deletes the Actions cache entries of a pull request when it closes. A pull
# request's entries (refs/pull/<number>/merge) are visible to that pull
# request alone, so after it closes they only take space from the
# repository's 10 GB, and GitHub then evicts entries that main still needs.
# A same-repository branch other than main loses its entries too
# (refs/heads/<branch>); entries of a fork's branch are not in this
# repository.
#
# A pins/* branch loses its entries earlier: when its CI run ends. Each SDK
# bump changes a lockfile, so its run saves a fresh 1.9 GB copy of the core
# node_modules that only that run reads. Four of those in one night filled the
# 10 GB. The entry is gone after the run, so "Re-run failed jobs" on a pins/*
# run finds no node_modules; use "Re-run all jobs" there.
#
# pull_request_target and workflow_run run with this repository's token, so
# the job checks out nothing and runs no code from the pull request. The
# branch name reaches the shell only through env. A failed delete is a
# warning, never a failure.

on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  delete-caches:
    # Of the CI runs, only a dispatch on a pins/* branch of this repository.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       startsWith(github.event.workflow_run.head_branch, 'pins/') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Delete the cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          refs=()
          if [[ "$EVENT" == "workflow_run" ]]; then
            # A second run on the branch still needs the entry. A failed
            # count deletes nothing; the close of the pull request does.
            if ! active="$(gh api --method GET "repos/$REPO/actions/workflows/ci.yml/runs" \
                -f branch="$RUN_BRANCH" -f per_page=30 \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length')"; then
              echo "::warning::Could not count the CI runs of $RUN_BRANCH."
              exit 0
            fi
            if [[ "$active" != "0" ]]; then
              echo "$active CI run(s) of $RUN_BRANCH are not complete; its entries stay."
              exit 0
            fi
            refs+=("refs/heads/$RUN_BRANCH")
          else
            refs+=("refs/pull/$PR_NUMBER/merge")
            if [[ "$HEAD_REPO" == "$REPO" && "$HEAD_BRANCH" != "main" ]]; then
              refs+=("refs/heads/$HEAD_BRANCH")
            fi
          fi
          for ref in "${refs[@]}"; do
            if ! entries="$(gh api --method GET --paginate "repos/$REPO/actions/caches" \
                -f ref="$ref" -f per_page=100 \
                --jq '.actions_caches[] | "\(.id) \(.size_in_bytes) \(.key)"')"; then
              echo "::warning::Could not list the cache entries of $ref."
              continue
            fi
            if [[ -z "$entries" ]]; then
              echo "No cache entries for $ref."
              continue
            fi
            while read -r id size key; do
              [[ -n "$id" ]] || continue
              if gh api --method DELETE "repos/$REPO/actions/caches/$id" > /dev/null; then
                echo "Deleted $key ($((size / 1048576)) MB) of $ref"
              else
                echo "::warning::Could not delete $key of $ref."
              fi
            done <<< "$entries"
          done
