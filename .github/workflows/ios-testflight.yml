name: iOS TestFlight

# Builds the ADE Beta iPhone app (com.ade.ios.beta) on a GitHub-hosted Mac
# and gives the build to its TestFlight testers. beta.yml calls it after each
# real beta is public; it can also be dispatched by hand. See
# docs/plans/ios-beta-app.md and docs/plans/beta-track.md (work item 8).
# scripts/release-tools/ios-testflight-ci.sh does the work. The normal app
# (com.ade.ios) gets builds only from stable releases.
#
# It runs only when iOS code changed since the last ADE Beta build (the newest
# ios-beta-v*-build* tag), so a beta that left iOS alone makes no TestFlight
# build. The base is the last ADE Beta build, not the previous beta: a beta
# whose TestFlight build failed must not hide its iOS changes from the next
# one.
#
# It also skips when the newest build of ios-main.yml on main failed (the
# iOS build and tests of main, which ci-pass and the beta do not wait for),
# so a main whose Swift tests fail gets no TestFlight build. A forced
# dispatch skips this check. When the check cannot read the runs, or finds
# no build in the newest 100 finished runs, the build goes ahead.
#
# It never fails or blocks the desktop beta. The feed does not wait for it,
# the TestFlight step and its job continue on error, and a failure opens (or
# comments on) the "iOS TestFlight failed" issue instead of the desktop's
# "Beta build failed" one.
#
# Signing: IOS_SIGNING_P12_BASE64 holds the CI's own Apple Development
# certificate, and the App Store Connect API key (APPLE_API_KEY_*) does the
# rest through Xcode's -allowProvisioningUpdates (profiles, and a
# cloud-managed distribution certificate). Without the .p12 every run leaves a
# new development certificate on the team until the limit stops all archives;
# the script's header lists what each mode needs.
#
# Xcode: 27.1, the version the iPhone app is built with on the owner's Mac.
# The Duo layout and the other iOS 27 code compile only with Swift 6.4 or
# newer (`#if compiler(>=6.4)`). An Xcode 26 build still compiles, but it
# leaves that code out, so an iPhone Duo shows the plain iPhone layout. Only
# the `xcode-27` runner image has Xcode 27; macos-26 stops at 26.6.

on:
  workflow_call:
    inputs:
      label:
        description: The beta tag this build belongs to (vX.Y.Z-beta.N).
        required: true
        type: string
      sha:
        description: The commit to build.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or commit to build.
        required: false
        default: main
        type: string
      force:
        description: Build even when iOS did not change since the last ADE Beta build.
        required: false
        default: false
        type: boolean
      dry_run:
        description: Archive and export only. Uploads and tags nothing.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    # Like the build job: a failure here must not fail the beta run.
    continue-on-error: true
    permissions:
      contents: read
      # Reads the newest run of ios-main.yml.
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      sha: ${{ steps.gate.outputs.sha }}
      label: ${{ steps.gate.outputs.label }}
    steps:
      # Full history and every tag: the base is the newest ios-beta-v*-build* tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether iOS changed
        id: gate
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_REF: ${{ inputs.git_ref }}
          FORCE: ${{ inputs.force && 'true' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            sha="$INPUT_SHA"
            label="$INPUT_LABEL"
          else
            ref="${INPUT_REF:-main}"
            if ! [[ "$ref" =~ ^[0-9A-Za-z._/-]+$ ]] || [[ "$ref" == *..* ]]; then
              echo "::error::$ref is not a branch name or a commit sha."
              exit 1
            fi
            sha="$(git rev-parse --verify --quiet "refs/remotes/origin/$ref^{commit}" || git rev-parse --verify "$ref^{commit}")"
            label="manual build of $ref"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve $sha to a commit."; exit 1; }
          # The paths that change the iPhone app: its sources, and this
          # pipeline. Generated iOS files are committed under apps/ios.
          paths=(apps/ios .github/workflows/ios-testflight.yml scripts/release-tools/ios-testflight-ci.sh)
          base_tag="$(git tag --list 'ios-beta-v*-build*' --sort=-creatordate | head -n 1)"
          if [ -z "$base_tag" ]; then
            changed=1
            reason="no earlier ADE Beta build tag"
          else
            changed="$(git diff --name-only "$base_tag..$sha" -- "${paths[@]}" | wc -l | tr -d ' ')"
            reason="$changed iOS files changed since $base_tag"
          fi
          run=false
          if [ -n "$FORCE" ] || [ "$changed" -gt 0 ]; then run=true; fi
          [ -n "$FORCE" ] && reason="forced; $reason"
          # A red ios-main.yml on main means main's Swift tests fail. The
          # check walks the newest 100 finished runs, newest first, and stops
          # at the first whose build job ended in success or failure. Most
          # runs skip the build (their gate says no) and still finish with
          # success, so the check reads each run's jobs instead of its
          # conclusion. Only a failure stops the build; a failed lookup, or
          # no build in 100 runs, lets it go ahead.
          if [ "$run" = true ] && [ -z "$FORCE" ]; then
            main_conclusion=""
            main_url=""
            lookup="none"
            if runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-main.yml/runs?branch=main&status=completed&per_page=100" \
                --jq '.workflow_runs[] | "\(.id) \(.html_url)"' 2>/dev/null)"; then
              while read -r run_id run_url; do
                [ -n "$run_id" ] || continue
                if ! job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                    --jq '[.jobs[] | select(.name == "build-and-test")][0].conclusion // empty' 2>/dev/null)"; then
                  lookup="failed"
                  break
                fi
                case "$job" in
                  success | failure) main_conclusion="$job"; main_url="$run_url"; break ;;
                esac
              done <<< "$runs"
            else
              lookup="failed"
            fi
            if [ "$main_conclusion" = failure ]; then
              run=false
              reason="the newest iOS main build failed ($main_url); $reason"
              echo "::warning::Skipping the TestFlight build: $reason"
            elif [ -n "$main_conclusion" ]; then
              echo "The newest iOS main build passed ($main_url)."
            elif [ "$lookup" = failed ]; then
              echo "Could not read the iOS main runs; building anyway."
            else
              echo "No iOS main build in the newest 100 finished runs; building anyway."
            fi
          fi
          {
            echo "run=$run"
            echo "sha=$sha"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "### iOS TestFlight: $([ "$run" = true ] && echo build || echo skipped)" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason (${sha:0:9}, $label)" >> "$GITHUB_STEP_SUMMARY"

  testflight:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 150
    # A broken runner or setup step must not fail the beta run either.
    continue-on-error: true
    # App Store Connect hands out build numbers; one build at a time.
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    permissions:
      # Pushes the ios-v<mv>-build<n> tag.
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          xcode=/Applications/Xcode_27.1.app
          if [[ ! -d "$xcode" ]]; then
            echo "::error::$xcode is not on this runner. The Duo layout needs Xcode 27 (Swift 6.4)."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      # The asc version ios-testflight.sh runs with, pinned by checksum.
      - name: Install asc
        env:
          ASC_VERSION: 1.2.3
          ASC_SHA256: 754b42e7ff126c49ae975f5ddf3302e58cc0695cf6d266a59ed2907336a87575
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/asc" \
            "https://github.com/rudrankriyam/App-Store-Connect-CLI/releases/download/$ASC_VERSION/asc_${ASC_VERSION}_macOS_arm64"
          echo "$ASC_SHA256  $bin/asc" | shasum -a 256 -c -
          chmod +x "$bin/asc"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build ADE Beta and give it to testers
        id: build
        continue-on-error: true
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          ADE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ADE_POSTHOG_PROJECT_TOKEN }}
          ADE_POSTHOG_HOST: ${{ secrets.ADE_POSTHOG_HOST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # For the PostHog dSYM upload (upload-ios-dsyms.sh).
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          LABEL: ${{ needs.gate.outputs.label }}
          SHA: ${{ needs.gate.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--label "$LABEL" --sha "$SHA")
          [ -n "$DRY_RUN" ] && args+=(--dry-run)
          bash scripts/release-tools/ios-testflight-ci.sh "${args[@]}"

      # "iOS Beta 1.4 (212) · TestFlight" on PostHog's charts. Skips without
      # POSTHOG_PERSONAL_API_KEY (or Node on the runner) and never fails the job.
      - name: Mark the TestFlight build on PostHog
        if: ${{ steps.build.outcome == 'success' && !inputs.dry_run }}
        continue-on-error: true
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          MARKETING_VERSION: ${{ steps.build.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::notice::Node is not on this runner; skipping the PostHog annotation."
            exit 0
          fi
          node scripts/posthog/annotate-release.mjs --app "iOS Beta" --ios "$MARKETING_VERSION" --build "$BUILD_NUMBER"

      - name: Report the result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.build.outcome }}
          LABEL: ${{ needs.gate.outputs.label }}
          SHA: ${{ needs.gate.outputs.sha }}
          BUILD: ${{ steps.build.outputs.marketing_version }} (${{ steps.build.outputs.build_number }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: |
          set -euo pipefail
          if [ -n "$DRY_RUN" ]; then
            echo "Dry run for $LABEL: $OUTCOME. Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
            [ "$OUTCOME" = success ] || echo "::warning::The dry run did not finish ($OUTCOME)."
            exit 0
          fi
          title="iOS TestFlight failed"
          gh label create beta --color FB8C00 --description "Beta track builds" >/dev/null 2>&1 || true
          issue="$(gh issue list --state open --label beta --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ "$OUTCOME" = success ]; then
            echo "ADE Beta build $BUILD for $LABEL is with Internal Testers." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Fixed: ADE Beta build $BUILD for $LABEL reached Internal Testers. $RUN_URL"
              gh issue close "$issue"
            fi
            exit 0
          fi
          echo "::warning::The TestFlight build for $LABEL did not finish ($OUTCOME). The desktop beta is not affected."
          body="$(printf 'Run: %s\nFor: %s\nCommit: %s\nStep outcome: %s\n\nThe desktop beta is not affected. The step log names the failing stage (archive, export, upload, processing or groups).\n' \
            "$RUN_URL" "$LABEL" "$SHA" "$OUTCOME")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --label beta --body "$body"
          fi
