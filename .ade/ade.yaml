version: 1
processes:
  - id: gq3sy4rj
    name: npm run dev:desktop
    command:
      - npm
      - run
      - dev:desktop
    cwd: .
    gracefulShutdownMs: 7000
    readiness:
      type: none
stackButtons: []
testSuites: []
laneOverlayPolicies: []
automations: []
ai:
  features:
    narratives: true
    conflict_proposals: true
    commit_messages: true
    pr_descriptions: true
    terminal_summaries: true
    memory_consolidation: true
    mission_planning: true
    orchestrator: true
    initial_context: true
  featureModelOverrides:
    commit_messages: openai/gpt-5.4-mini
    pr_descriptions: openai/gpt-5.4-mini
    terminal_summaries: openai/gpt-5.4-mini
  sessionIntelligence:
    titles:
      enabled: true
      modelId: openai/gpt-5.4-mini
      refreshOnComplete: true
    summaries:
      modelId: openai/gpt-5.4-mini
  localProviders:
    lmstudio:
      enabled: true
      endpoint: http://127.0.0.1:1234
      autoDetect: true
      preferredModelId: null
