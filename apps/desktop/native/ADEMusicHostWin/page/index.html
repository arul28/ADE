<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADE Music</title>
<meta name="color-scheme" content="light">
<style>
  html, body { margin: 0; background: #fff; color: #222; font: 13px system-ui, sans-serif; }
  #status { padding: 12px; color: #666; }
</style>
</head>
<body>
  <!-- ADE's player page. It has no UI of its own: ADE's React UI drives it over
       the host's stdio channel. The status line only shows when the window is
       made visible for debugging. -->
  <div id="status">Loading MusicKit</div>
  <script src="player.js"></script>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
</body>
</html>
