[package]
name = "ade-desktop-driver-linux"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "ADE lane screens on Linux: one Xvfb display per lane, driven over ADE's desktop-driver NDJSON wire."

[[bin]]
name = "ade-desktop-driver"
path = "src/main.rs"

[dependencies]
# Pure-Rust X11 client: no libxcb, so the binary links statically against musl.
x11rb = { version = "0.13", features = ["xtest", "damage", "xfixes", "shm"] }
# Pure-Rust D-Bus, for AT-SPI on each lane's private session bus.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
