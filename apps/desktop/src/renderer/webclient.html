<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://clerk.ade-app.dev" crossorigin />
    <link rel="preconnect" href="https://ade-account-directory-production.arulsharma1028.workers.dev" crossorigin />
    <title>ADE</title>
    <style>
      /* The app shell sizes itself with `h-full`, a percentage that resolves to
         nothing unless every ancestor has a definite height. `min-height` alone
         left #root auto-height, collapsing the whole app to content height. */
      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
      }

      /* The app never scrolls the document: every surface owns its own scroll
         container, exactly as it does inside the Electron window (which has no
         document scrollbar to hand overflow to). Giving these elements a
         definite height creates that scrollbar in the browser, so anything that
         overflows the shell — a banner stacked beside the `h-full` AppShell, a
         terminal viewport that declines a wheel event — would scroll the WHOLE
         page instead of the pane under the pointer. Contain it here. */
      html,
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        background: #0b0b0f;
      }

      /* xterm draws its own scrollbar as plain divs inside
         `.xterm-scrollable-element` (see @xterm/xterm/css/xterm.css). It is
         display-only chrome: scrolling is driven by the wheel handler and
         `scrollLines`, so hiding the bar costs no functionality. Web only —
         desktop loads index.html and is untouched by this file. */
      .xterm .xterm-scrollable-element > .scrollbar,
      .xterm .scrollbar {
        display: none !important;
      }

      .ade-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: rgba(244, 244, 247, 0.88);
        font: 500 15px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.28em;
      }

      .ade-splash__spinner {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(244, 244, 247, 0.16);
        border-top-color: rgba(244, 244, 247, 0.72);
        border-radius: 50%;
        animation: ade-splash-spin 0.8s linear infinite;
      }

      @keyframes ade-splash-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ade-splash__spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ade-splash" role="status" aria-label="Loading ADE">
        <span>ADE</span>
        <span class="ade-splash__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/webclient/main.tsx"></script>
  </body>
</html>
