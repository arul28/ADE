<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://clerk.ade-app.dev" crossorigin />
    <link rel="preconnect" href="https://ade-account-directory-production.arulsharma1028.workers.dev" crossorigin />
    <title>ADE</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #0b0b0f;
      }

      .ade-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: rgba(244, 244, 247, 0.88);
        font: 500 15px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.28em;
      }

      .ade-splash__spinner {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(244, 244, 247, 0.16);
        border-top-color: rgba(244, 244, 247, 0.72);
        border-radius: 50%;
        animation: ade-splash-spin 0.8s linear infinite;
      }

      @keyframes ade-splash-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ade-splash__spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ade-splash" role="status" aria-label="Loading ADE">
        <span>ADE</span>
        <span class="ade-splash__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/webclient/main.tsx"></script>
  </body>
</html>
